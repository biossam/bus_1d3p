<!DOCTYPE html>
<html lang="ko">
<head>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
/* 수식 */
sup{font-size:.72em;line-height:0}sub{font-size:.72em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 2px;line-height:1.25}.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}.fr>span:last-child{padding:0 3px}

.h2{font-size:24px;margin:4px 0}

.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.oxb{font-family:'Jua';font-size:44px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 0}

.sol{margin-top:10px;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;line-height:1.85}.sol b{color:var(--sub);font-size:13px}
.two .rate{margin-top:12px}
.done .emoji{font-size:52px;text-align:center;margin-top:10px}

.maprow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-size:14px}.maprow select{padding:5px 8px;font-size:13px}

.q{white-space:normal}
.card.exam{border-color:#BFD2F7;background:var(--skyL)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let v=0;while(v===0)v=ri(a,b);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const N=n=>n<0?'−'+(-n):String(n);
const pt=(x,y)=>`(${N(x)}, ${N(y)})`;
function term(co,v,first){if(co===0)return '';const a=Math.abs(co);const s=co<0?(first?'−':' − '):(first?'':' + ');return s+(v?(a===1?'':a)+v:a)}
function poly(cs,v='x'){let s='';const d=cs.length-1;cs.forEach((co,i)=>{const p=d-i;const vv=p===0?'':p===1?v:v+'^'+p;s+=term(co,vv,!s)});return s||'0'}
function lin(a,b,c){let s=term(a,'x',true);s+=term(b,'y',!s);s+=term(c,'',!s);return s+' = 0'}
function cx(re,im){if(im===0)return N(re);const ip=Math.abs(im)===1?'i':Math.abs(im)+'i';if(re===0)return (im<0?'−':'')+ip;return N(re)+(im<0?' − ':' + ')+ip}
function numD(n,pos){const c=[n+1,n-1,n+2,n-2,-n,n*2,n+3,n-3,n+4];return c.filter(v=>v!==n&&(!pos||v>0)).map(N)}
function mc(l,q,ans,ds,s){const seen=new Set([ans]);const c=[ans];for(const d of ds){if(!seen.has(d)){seen.add(d);c.push(d)}if(c.length===5)break}const num=String(ans).replace('−','-');if(c.length<5&&/^-?\d+$/.test(num)){for(const d of numD(+num,+num>0)){if(!seen.has(d)){seen.add(d);c.push(d)}if(c.length===5)break}}return {l,t:'mc',q,x:c,s}}
function mat(m){return '⟦'+m.map(r=>r.map(N).join(',')).join(';')+'⟧'}
const fact=n=>n<=1?1:n*fact(n-1);
const nPr=(n,r)=>fact(n)/fact(n-r), nCr=(n,r)=>nPr(n,r)/fact(r);

function fmt(s){if(s!=null&&String(s).charCodeAt(0)===0x2063)return fmtNew(s);return fmtOld(s)}
function fmtNew(s){
  if(s==null)return '';
  s=String(s).replace(/\u2063/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const H=[];const ph=h=>'\u0001'+(H.push(h)-1)+'\u0002';
  const R=[[/\^\{([^{}]*)\}/g,(m,a)=>ph('<sup>'+a+'</sup>')],[/_\{([^{}]*)\}/g,(m,a)=>ph('<sub>'+a+'</sub>')],
    [/√\{([^{}]*)\}/g,(m,a)=>ph('√<span class="sq">'+a+'</span>')],[/‾\{([^{}]*)\}/g,(m,a)=>ph('<span class="ov">'+a+'</span>')],
    [/\{\{([^{}§]*)§([^{}§]*)\}\}/g,(m,a,b)=>ph('<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>')],
    [/⟦([^⟦⟧]*)⟧/g,(m,a)=>ph('<span class="mx">'+a.split('¦').map(r=>'<span class="r">'+r.split('¤').map(c=>'<span>'+c+'</span>').join('')+'</span>').join('')+'</span>')],
    [/⇀\{([^{}]*)\}/g,(m,a)=>ph('<span class="vec">'+a+'</span>')],
    [/⟦([^⟦⟧]*¦[^⟦⟧]*)⟧/g,(m,a)=>ph('<span class="mx">'+a.split('¦').map(r=>'<span class="r">'+r.split('¤').map(c=>'<span>'+c+'</span>').join('')+'</span>').join('')+'</span>')],
    [/⦃([^⦃⦄]*)⦄/g,(m,a)=>ph('<span class="pw">'+a.split('¦').map(r=>'<span>'+r+'</span>').join('')+'</span>')]];
  for(let k=0;k<12;k++){const o=s;R.forEach(([re,f])=>{s=s.replace(re,f)});if(o===s)break}
  s=s.replace(/\^(-?\d+|[a-zA-Z])/g,'<sup>$1</sup>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');
  for(let k=0;k<12&&/\u0001/.test(s);k++)s=s.replace(/\u0001(\d+)\u0002/g,(m,i)=>H[+i]);
  return s.replace(/\n/g,'<br>');
}
function fmtOld(s){
  if(s==null)return '';
  s=String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^{}]*)\}/g,'<sub>$1</sub>');
  s=s.replace(/\^(-?\d+|[a-zA-Zα-ω])/g,'<sup>$1</sup>').replace(/_(\d)/g,'<sub>$1</sub>');
  s=s.replace(/√\{([^{}]*)\}/g,'√<span class="sq">$1</span>');
  s=s.replace(/\{\{(.+?)§(.+?)\}\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
  s=s.replace(/⟦([^⟧]*)⟧/g,(m,b)=>'<span class="mx">'+b.split(';').map(r=>'<span class="r">'+r.split(',').map(c=>'<span>'+c+'</span>').join('')+'</span>').join('')+'</span>');
  return s.replace(/\n/g,'<br>');
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

CONCEPTS.push(...[{"id": "sg1", "u": "SG1", "ex": "GE", "t": "가로등과 담장 사이 등거리 산책론", "sm": 1, "en": "Theory of the Equidistant Walk", "th": [["p", "⁣공원에 가로등(점) 하나와 곧은 담장(직선) 하나가 있습니다. 강아지가 \"가로등까지의 거리와 담장까지의 거리가 **언제나 같도록**\" 산책하면 어떤 길이 생길까요? 가로등을 감싸며 담장 반대쪽으로 활짝 벌어지는 곡선, 바로 **포물선**입니다. 가로등이 **초점** F, 담장이 **준선**입니다."], ["p", "⁣초점이 F(p, 0), 준선이 x = −p일 때 포물선 위의 점 P(x, y)에 대하여 ‾{PF} = (준선까지의 거리)이므로"], ["p", "⁣√{(x − p)^{2} + y^{2}} = |x + p| ⇒ y^{2} = 4px"], ["p", "⁣이 식은 외우는 공식이 아니라 \"두 거리가 같다\"는 문장을 그대로 번역한 결과입니다. 그래서 포물선 문제에서 **초점까지의 거리**가 나오면, 계산하기 어려운 대각선 거리를 계산하기 쉬운 **준선까지의 수직 거리**로 바꾸는 것이 핵심 전략입니다."], ["li", "⁣**1:1 매칭 기호 독해법**: ==\"초점까지의 거리\"== → 준선까지의 거리로 바꾸기(y^{2} = 4px에서는 x + p, x^{2} = 4py에서는 준선 y = −p까지의 거리 y + p). ==\"==‾{PA} + ‾{PF}==의 최솟값\"== → ‾{PF}를 준선까지 거리로 바꾼 뒤 점 A에서 준선에 수선 긋기."], ["p", "⁣**[보충] 포물선 방정식 정리표**"], ["tbl", [["⁣방정식", "⁣초점", "⁣준선", "⁣열리는 방향"], ["⁣y^{2} = 4px", "⁣(p, 0)", "⁣x = −p", "⁣p > 0이면 오른쪽"], ["⁣x^{2} = 4py", "⁣(0, p)", "⁣y = −p", "⁣p > 0이면 위쪽"], ["⁣(y − n)^{2} = 4p(x − m)", "⁣(p + m, n)", "⁣x = −p + m", "⁣y^{2} = 4px를 평행이동"]]], ["p", "⁣**[보충]** 4p **읽기**: y^{2} = 8x라면 4p = 8에서 p = 2입니다. 방정식에서 4p 자리의 수를 4로 나누면 꼭짓점에서 초점까지의 거리가 나옵니다."]], "sum": ["⁣신호: \"초점까지의 거리\", \"준선\" → **초점 거리 = 준선 거리, y^{2} = 4px**", "⁣**1:1 매칭 기호 독해법**: ==\"초점까지의 거리\"== → 준선까지의 거리로 바꾸기(y^{2} = 4px에서는 x + p, x^{2} = 4py에서는 준선 y = −p까지의 거리 y + p). ==\"==‾{PA} + ‾{PF}==의 최솟값\"== → ‾{PF}를 준선까지 거리로 바꾼 뒤 점 A에서 준선에 수선 긋기."], "fl": [["⁣\"초점까지의 거리\", \"준선\" — 이 신호를 보면 꺼낼 도구는?", "⁣초점 거리 = 준선 거리, y^{2} = 4px"], ["⁣방정식: y^{2} = 4px → 초점 / 준선 / 열리는 방향?", "⁣(p, 0) / x = −p / p > 0이면 오른쪽"], ["⁣방정식: x^{2} = 4py → 초점 / 준선 / 열리는 방향?", "⁣(0, p) / y = −p / p > 0이면 위쪽"], ["⁣방정식: (y − n)^{2} = 4p(x − m) → 초점 / 준선 / 열리는 방향?", "⁣(p + m, n) / x = −p + m / y^{2} = 4px를 평행이동"]], "bk": {"q": "책을 덮고 「가로등과 담장 사이 등거리 산책론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["⁣신호 문장: \"초점까지의 거리\", \"준선\"", "⁣꺼낼 도구: 초점 거리 = 준선 거리, y^{2} = 4px", "⁣1:1 매칭 기호 독해법", "⁣4p 읽기", "⁣가로등 찾기", "⁣담장 찾기"]}, "pr": [{"l": 3, "t": "self", "q": "⁣포물선 y^{2} = 8x의 ==초점의 좌표와 준선의 방정식==을 구하시오.", "x": null, "s": "⁣**1. 4p 읽기** 4p = 8에서 p = 2\n**2. 가로등 찾기** 초점 F(2, 0)\n**3. 담장 찾기** 준선 x = −2", "ck": ["⁣4p 읽기", "⁣가로등 찾기", "⁣담장 찾기"], "src": "태원고 기출 기반"}, {"l": 2, "t": "self", "q": "⁣포물선 y^{2} = 8x 위의 점 P에서 ==초점까지의 거리가 6==일 때, 점 P의 x좌표를 구하시오.", "x": null, "s": "⁣**1. 거리 바꿔 타기** 초점까지의 거리 = 준선 x = −2까지의 거리 = x + 2\n**2. 방정식 세우기** x + 2 = 6\n**3. 정산** x = 4", "ck": ["⁣거리 바꿔 타기", "⁣방정식 세우기", "⁣정산"], "src": "분당 지역 고교 기출 스타일"}, {"l": 2, "t": "self", "q": "⁣==초점이== F(0, 2)==이고 준선이== y = −2인 포물선의 방정식을 구하시오.", "x": null, "s": "⁣**1. 정의 번역** 점 P(x, y)에 대하여 √{x^{2} + (y − 2)^{2}} = |y + 2|\n**2. 양변 제곱** x^{2} + y^{2} − 4y + 4 = y^{2} + 4y + 4\n**3. 정산** x^{2} = 8y", "ck": ["⁣정의 번역", "⁣양변 제곱", "⁣정산"], "src": "교과서 연계"}, {"l": 3, "t": "self", "q": "⁣포물선 y^{2} = 4x의 초점을 F, 점 A(5, 2)라 하자. 포물선 위의 점 P에 대하여 ‾{PA} + ‾{PF}==의 최솟값==을 구하시오.", "x": null, "s": "⁣**1. 거리 바꿔 타기** 초점 F(1, 0), 준선 x = −1. 점 P에서 준선에 내린 수선의 발을 H라 하면 ‾{PF} = ‾{PH}\n**2. 일직선 만들기** 점 A는 포물선 안쪽(2^{2} < 4 × 5)에 있으므로, A를 지나는 수평선은 포물선과 한 점에서 만납니다. ‾{PA} + ‾{PH}는 A, P, H가 이 수평선 위에 있을 때 가장 짧습니다.\n**3. 정산** 점 A에서 준선까지의 거리 5 − (−1) = 6", "ck": ["⁣거리 바꿔 타기", "⁣일직선 만들기", "⁣정산"], "src": "태원고 스타일 적중 변형 문제"}, {"l": 1, "t": "self", "q": "⁣포물선 y^{2} = 4x의 초점의 좌표와 준선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: 초점 (1, 0), 준선 x = −1**\n**신호 읽기**: y^{2} = 4px 꼴 → [보충] 4p 읽기로 가로등(초점)과 담장(준선)을 찾습니다.\n**상황 번역**: 4p = 4이므로 꼭짓점에서 가로등까지, 꼭짓점에서 담장까지의 거리가 모두 p = 1\n**풀이**: 초점 (1, 0), 준선 x = −1\n**함정**: 초점과 준선은 꼭짓점을 사이에 두고 반대쪽에 있습니다. 부호가 반대인지 확인합니다.", "src": "실전 다지기 1"}, {"l": 1, "t": "self", "q": "⁣포물선 x^{2} = −8y의 초점의 좌표와 준선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: 초점 (0, −2), 준선 y = 2**\n**신호 읽기**: x^{2} = 4py 꼴 → 위아래로 열리는 포물선입니다.\n**상황 번역**: 4p = −8 → p = −2. p < 0이므로 가로등이 아래쪽에 있고 포물선은 아래로 열립니다.\n**풀이**: 초점 (0, p) = (0, −2), 준선 y = −p = 2\n**함정**: p가 음수일 때 준선은 y = −p이므로 양수 2가 됩니다.", "src": "실전 다지기 2"}, {"l": 1, "t": "self", "q": "⁣초점이 F(3, 0)이고 준선이 x = −3인 포물선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: y^{2} = 12x**\n**신호 읽기**: 초점과 준선이 주어짐 → 꼭짓점은 둘의 한가운데, p는 그 거리\n**상황 번역**: 초점 (3, 0), 준선 x = −3 → 꼭짓점 원점, p = 3\n**풀이**: y^{2} = 4 × 3 × x = 12x\n**함정**: 정의로 직접 세워도 됩니다: √{(x − 3)^{2} + y^{2}} = |x + 3|을 제곱하면 y^{2} = 12x", "src": "실전 다지기 3"}, {"l": 2, "t": "sa", "q": "⁣포물선 y^{2} = 12x 위의 점 P에서 초점까지의 거리가 9일 때, 점 P의 x좌표를 구하시오.", "x": "6|6개|6가지", "s": "⁣**신호 읽기**: \"초점까지의 거리\" → 담장(준선)까지의 거리로 바꿔 타는 신호입니다.\n**상황 번역**: 4p = 12 → p = 3, 준선 x = −3. 포물선 위의 점에서 담장까지 거리는 x + 3\n**풀이**: x + 3 = 9 → x = 6\n**함정**: 초점까지의 대각선 거리를 √{(x − 3)^{2} + y^{2}}로 계산하면 y까지 구해야 해 길어집니다.", "src": "실전 다지기 4"}, {"l": 2, "t": "self", "q": "⁣포물선 y^{2} = 4px가 점 (2, 4)를 지날 때, 상수 p의 값과 초점의 좌표를 구하시오.", "x": null, "s": "⁣**정답: p = 2, 초점 (2, 0)**\n**신호 읽기**: \"점을 지날 때\" → 그 점의 좌표를 방정식에 대입합니다.\n**상황 번역**: (2, 4)를 y^{2} = 4px에 넣습니다.\n**풀이**: 16 = 4p × 2 → p = 2 → 초점 (2, 0)\n**함정**: 구한 p로 초점을 바로 읽습니다. 확인: (2, 4)에서 초점까지 4, 준선 x = −2까지 4로 같습니다.", "src": "실전 다지기 5"}, {"l": 2, "t": "sa", "q": "⁣포물선 x^{2} = 4y 위의 점 중에서 초점까지의 거리가 5인 점의 y좌표를 구하시오.", "x": "4|4개|4가지", "s": "⁣**신호 읽기**: x^{2} = 4py에서 \"초점까지의 거리\" → 담장 y = −p까지의 거리 y + p\n**상황 번역**: 4p = 4 → p = 1, 준선 y = −1\n**풀이**: y + 1 = 5 → y = 4\n**함정**: 위아래로 열린 포물선에서는 x가 아니라 y로 거리를 잽니다.", "src": "실전 다지기 6"}, {"l": 2, "t": "self", "q": "⁣포물선 위의 점에서 초점까지의 거리를 준선까지의 거리로 바꾸어 계산하는 이유를 '가로등과 담장' 비유로 서술하시오.", "x": null, "s": "⁣**정답: 포물선 위의 점은 가로등(초점)과 담장(준선)까지의 거리가 항상 같은 점들이다. 초점까지의 거리는 대각선이라 계산이 복잡하지만, 담장까지의 거리는 수직으로 재는 거리라 좌표 하나로 바로 계산된다. 두 거리가 같으므로 쉬운 쪽으로 바꾸어 구한다.**\n**신호 읽기**: 비유를 지정한 서술형 → 정의(두 거리가 같다)와 계산의 편리함을 함께 씁니다.\n**상황 번역**: 예: y^{2} = 4px 위의 점에서 초점까지의 거리는 x + p로 바로 나옵니다.\n**풀이**: 4번, 6번 문항이 이 방법의 예라는 점을 들면 좋습니다.\n**함정**: \"편해서\"만 쓰면 근거가 부족합니다. '정의상 두 거리가 같다'가 핵심입니다.", "src": "실전 다지기 7"}, {"l": 3, "t": "sa", "q": "⁣점 (4, b)가 포물선 y^{2} = 8x 위의 점일 때, b^{2}의 값을 구하시오.", "x": "32|32개|32가지", "s": "⁣**신호 읽기**: \"포물선 위의 점\" → 좌표를 방정식에 대입합니다.\n**상황 번역**: (4, b)를 y^{2} = 8x에 넣습니다.\n**풀이**: b^{2} = 8 × 4 = 32\n**함정**: b가 아니라 b^{2}을 물었습니다. b = ± 4√{2}까지 구할 필요가 없습니다.", "src": "실전 다지기 8"}, {"l": 3, "t": "self", "q": "⁣꼭짓점이 원점이고 초점이 x축 위에 있으며 점 (1, 2)를 지나는 포물선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: y^{2} = 4x**\n**신호 읽기**: \"꼭짓점이 원점, 초점이 x축 위\" → y^{2} = 4px 꼴로 두라는 신호입니다.\n**상황 번역**: 지나는 점 (1, 2)로 p를 정합니다.\n**풀이**: 4 = 4p × 1 → p = 1 → y^{2} = 4x\n**함정**: 초점이 y축 위였다면 x^{2} = 4py 꼴로 둡니다. 초점의 위치가 식의 꼴을 정합니다.", "src": "실전 다지기 9"}, {"l": 3, "t": "self", "q": "⁣포물선 (y − 1)^{2} = 8(x + 2)의 초점의 좌표와 준선의 방정식을 구하고, 이 포물선 위의 점 P에서 초점까지의 거리가 5일 때 점 P의 x좌표를 구하시오.", "x": null, "s": "⁣**정답: 초점 (0, 1), 준선 x = −4, 점 P의 x좌표 1**\n**신호 읽기**: [고난도] (y − n)^{2} = 4p(x − m) 꼴 → [보충] 정리표 셋째 줄, 평행이동한 포물선\n**상황 번역**: y^{2} = 8x(꼭짓점 원점, 초점 (2, 0), 준선 x = −2)를 x축 방향으로 − 2, y축 방향으로 1만큼 옮긴 것입니다. 가로등과 담장도 함께 옮겨 갑니다.\n**풀이**: 초점 (2 − 2, 0 + 1) = (0, 1), 준선 x = −2 − 2 = −4. 점 P에서 담장까지 거리 x − (−4) = x + 4 = 5 → x = 1\n**함정**: 평행이동할 때 준선은 x 방향 이동만 받습니다(세로선이므로). y 방향 이동은 준선의 식에 영향을 주지 않습니다.", "src": "실전 다지기 10"}]}, {"id": "sg2", "u": "SG1", "ex": "GE", "t": "두 말뚝과 끈 한 줄론", "sm": 1, "en": "Theory of the Two Stakes and a String", "th": [["p", "⁣운동장에 말뚝 두 개를 박고, 길이가 정해진 끈의 양 끝을 두 말뚝에 묶습니다. 연필로 끈을 팽팽하게 당긴 채 한 바퀴 돌면 길쭉한 원, 즉 **타원**이 그려집니다. 연필이 어디에 있든 **두 말뚝까지 거리의 합은 끈의 길이로 일정**합니다. 두 말뚝이 **초점** F, F′이고 끈의 길이가 **장축의 길이** 2a입니다."], ["p", "⁣‾{PF} + ‾{PF′} = 2a, {{x^{2}§a^{2}}} + {{y^{2}§b^{2}}} = 1 (b^{2} = a^{2} − c^{2})"], ["p", "⁣초점이 (± c, 0)일 때, 단축의 끝점 (0, b)에서는 끈이 정확히 반으로 접혀 두 말뚝까지 거리가 각각 a입니다. 그래서 피타고라스 정리로 a^{2} = b^{2} + c^{2}이라는 관계가 나옵니다."], ["li", "⁣**1:1 매칭 기호 독해법**: ==\"두 초점으로부터 거리의 합\"== → 끈의 길이 2a. ==\"삼각형== PF′ F==의 둘레\"== → 2a + 2c (끈 + 말뚝 사이 거리). ==\"단축의 끝점\"== → 두 초점까지 거리가 모두 a."], ["p", "⁣**[보충] 타원 방정식 정리표**"], ["tbl", [["⁣방정식", "⁣장축", "⁣초점", "⁣관계"], ["⁣{{x^{2}§a^{2}}} + {{y^{2}§b^{2}}} = 1 (a > b > 0)", "⁣x축 위, 길이 2a", "⁣(± c, 0)", "⁣c^{2} = a^{2} − b^{2}"], ["⁣{{x^{2}§a^{2}}} + {{y^{2}§b^{2}}} = 1 (b > a > 0)", "⁣y축 위, 길이 2b", "⁣(0, ± c)", "⁣c^{2} = b^{2} − a^{2}"], ["⁣{{(x − m)^{2}§a^{2}}} + {{(y − n)^{2}§b^{2}}} = 1", "⁣중심 (m, n)", "⁣초점도 x축 방향으로 m, y축 방향으로 n만큼 이동", "⁣위와 같음"]]], ["p", "⁣**[보충] 큰 분모 읽기**: 분모가 큰 쪽 축으로 길쭉합니다. {{x^{2}§9}} + {{y^{2}§25}} = 1은 y축 방향이 긴 타원이므로 초점도 y축 위에 있습니다."]], "sum": ["⁣신호: \"두 초점으로부터 거리의 합\" → **‾{PF} + ‾{PF′} = 2a, c^{2} = a^{2} − b^{2}**", "⁣**1:1 매칭 기호 독해법**: ==\"두 초점으로부터 거리의 합\"== → 끈의 길이 2a. ==\"삼각형== PF′ F==의 둘레\"== → 2a + 2c (끈 + 말뚝 사이 거리). ==\"단축의 끝점\"== → 두 초점까지 거리가 모두 a."], "fl": [["⁣\"두 초점으로부터 거리의 합\" — 이 신호를 보면 꺼낼 도구는?", "⁣‾{PF} + ‾{PF′} = 2a, c^{2} = a^{2} − b^{2}"], ["⁣방정식: {{x^{2}§a^{2}}} + {{y^{2}§b^{2}}} = 1 (a > b > 0) → 장축 / 초점 / 관계?", "⁣x축 위, 길이 2a / (± c, 0) / c^{2} = a^{2} − b^{2}"], ["⁣방정식: {{x^{2}§a^{2}}} + {{y^{2}§b^{2}}} = 1 (b > a > 0) → 장축 / 초점 / 관계?", "⁣y축 위, 길이 2b / (0, ± c) / c^{2} = b^{2} − a^{2}"], ["⁣방정식: {{(x − m)^{2}§a^{2}}} + {{(y − n)^{2}§b^{2}}} = 1 → 장축 / 초점 / 관계?", "⁣중심 (m, n) / 초점도 x축 방향으로 m, y축 방향으로 n만큼 이동 / 위와 같음"]], "bk": {"q": "책을 덮고 「두 말뚝과 끈 한 줄론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["⁣신호 문장: \"두 초점으로부터 거리의 합\"", "⁣꺼낼 도구: ‾{PF} + ‾{PF′} = 2a, c^{2} = a^{2} − b^{2}", "⁣1:1 매칭 기호 독해법", "⁣큰 분모 읽기", "⁣말뚝 위치 계산", "⁣정산"]}, "pr": [{"l": 3, "t": "self", "q": "⁣타원 {{x^{2}§25}} + {{y^{2}§9}} = 1의 ==초점의 좌표와 장축, 단축의 길이==를 구하시오.", "x": null, "s": "⁣**1. 큰 분모 읽기** a^{2} = 25, b^{2} = 9 → x축 방향이 긴 타원\n**2. 말뚝 위치 계산** c^{2} = 25 − 9 = 16, c = 4 → 초점 (± 4, 0)\n**3. 정산** 장축 2a = 10, 단축 2b = 6", "ck": ["⁣큰 분모 읽기", "⁣말뚝 위치 계산", "⁣정산"], "src": "태원고 기출 기반"}, {"l": 2, "t": "self", "q": "⁣타원 {{x^{2}§16}} + {{y^{2}§7}} = 1의 두 초점을 F, F′이라 하자. 타원 위의 점 P에 대하여 ==삼각형== PF′ F==의 둘레의 길이==를 구하시오. (단, 점 P는 x축 위에 있지 않다.)", "x": null, "s": "⁣**1. 끈의 길이** a = 4 → ‾{PF} + ‾{PF′} = 8\n**2. 말뚝 사이 거리** c^{2} = 16 − 7 = 9, c = 3 → ‾{FF′} = 6\n**3. 정산** 8 + 6 = 14", "ck": ["⁣끈의 길이", "⁣말뚝 사이 거리", "⁣정산"], "src": "분당 지역 고교 기출 스타일"}, {"l": 2, "t": "self", "q": "⁣==두 초점== (3, 0)==,== (−3, 0)==으로부터 거리의 합이 10==인 점이 나타내는 도형의 방정식을 구하시오.", "x": null, "s": "⁣**1. 끈과 말뚝 읽기** 2a = 10에서 a = 5, c = 3\n**2. b^{2} 계산** b^{2} = a^{2} − c^{2} = 25 − 9 = 16\n**3. 정산** {{x^{2}§25}} + {{y^{2}§16}} = 1", "ck": ["⁣끈과 말뚝 읽기", "⁣b^{2} 계산", "⁣정산"], "src": "교과서 연계"}, {"l": 3, "t": "self", "q": "⁣타원 {{x^{2}§16}} + {{y^{2}§10}} = 1의 두 초점을 F, F′이라 하고, ==단축의 한 끝점==을 P라 할 때, cos (∠ FPF′)의 값을 구하시오.", "x": null, "s": "⁣**1. 반으로 접힌 끈** 단축의 끝점에서는 ‾{PF} = ‾{PF′} = a = 4\n**2. 말뚝 사이 거리** c^{2} = 16 − 10 = 6 → ‾{FF′} = 2√{6}\n**3. 정산 (대수에서 배운 코사인법칙)** cos (∠ FPF′) = {{16 + 16 − 24§2 × 4 × 4}} = {{8§32}} = {{1§4}}", "ck": ["⁣반으로 접힌 끈", "⁣말뚝 사이 거리", "⁣정산 (대수에서 배운 코사인법칙)"], "src": "태원고 스타일 적중 변형 문제"}, {"l": 1, "t": "self", "q": "⁣타원 {{x^{2}§16}} + {{y^{2}§4}} = 1의 초점의 좌표를 구하시오.", "x": null, "s": "⁣**정답: (2√{3}, 0), (−2√{3}, 0)**\n**신호 읽기**: 타원의 초점 → 큰 분모 a^{2}, 작은 분모 b^{2}에서 c^{2} = a^{2} − b^{2}\n**상황 번역**: 단축의 끝점에서 끈이 반으로 접혀 a^{2} = b^{2} + c^{2}인 직각삼각형이 생깁니다.\n**풀이**: c^{2} = 16 − 4 = 12 → c = 2√{3}. 큰 분모가 x^{2} 아래 있으므로 초점은 x축 위\n**함정**: 타원은 빼기(a^{2} − b^{2}), 쌍곡선은 더하기(a^{2} + b^{2})입니다.", "src": "실전 다지기 1"}, {"l": 1, "t": "self", "q": "⁣1번 문항의 타원의 장축과 단축의 길이를 구하시오.", "x": null, "s": "⁣**정답: 장축 8, 단축 4**\n**신호 읽기**: 장축은 끈의 길이 2a, 단축은 2b\n**상황 번역**: a^{2} = 16, b^{2} = 4\n**풀이**: 2a = 8, 2b = 4\n**함정**: 반지름처럼 a, b만 쓰면 반장축, 반단축입니다. '길이'는 두 배입니다.", "src": "실전 다지기 2"}, {"l": 1, "t": "self", "q": "⁣두 초점이 (0, 4), (0, −4)이고 장축의 길이가 10인 타원의 방정식을 구하시오.", "x": null, "s": "⁣**정답: {{x^{2}§9}} + {{y^{2}§25}} = 1**\n**신호 읽기**: 초점이 y축 위 → 장축이 y축 방향 → y^{2}의 분모가 더 큽니다.\n**상황 번역**: 장축 10이므로 y 방향 반지름 5, 말뚝 사이 반거리 c = 4\n**풀이**: x^{2}의 분모 = 5^{2} − 4^{2} = 9 → {{x^{2}§9}} + {{y^{2}§25}} = 1\n**함정**: 큰 분모를 x^{2} 아래 쓰면 초점이 x축으로 옮겨 갑니다. [보충] 큰 분모 읽기로 확인합니다.", "src": "실전 다지기 3"}, {"l": 2, "t": "sa", "q": "⁣타원 {{x^{2}§36}} + {{y^{2}§20}} = 1의 두 초점을 F, F′이라 할 때, 타원 위의 점 P에 대하여 ‾{PF} + ‾{PF′}의 값을 구하시오.", "x": "12|12개|12가지", "s": "⁣**신호 읽기**: \"‾{PF} + ‾{PF′}\" → 끈의 길이 2a를 그대로 묻습니다.\n**상황 번역**: 연필이 어디 있든 두 말뚝까지 끈 길이는 같습니다.\n**풀이**: a^{2} = 36 → 2a = 12\n**함정**: 점 P의 좌표를 구할 필요가 없습니다. 정의만으로 답이 나옵니다.", "src": "실전 다지기 4"}, {"l": 2, "t": "sa", "q": "⁣4번 문항의 타원 위의 점 P에 대하여 ‾{PF} = 5일 때, ‾{PF′}의 값을 구하시오.", "x": "7|7개|7가지", "s": "⁣**신호 읽기**: 한쪽 거리가 주어지고 다른 쪽을 묻습니다 → 끈의 길이에서 뺍니다.\n**상황 번역**: 끈 12 중 5가 F 쪽이면 나머지가 F′ 쪽\n**풀이**: 12 − 5 = 7\n**함정**: 4번의 결과를 그대로 이어 쓰는 문제입니다.", "src": "실전 다지기 5"}, {"l": 2, "t": "self", "q": "⁣두 초점이 (0, √{5}), (0, −√{5})이고 장축의 길이가 6인 타원의 방정식을 구하시오.", "x": null, "s": "⁣**정답: {{x^{2}§4}} + {{y^{2}§9}} = 1**\n**신호 읽기**: 초점이 y축 위 → y^{2}의 분모가 큼\n**상황 번역**: 장축 6 → y 방향 반지름 3, c^{2} = 5\n**풀이**: x^{2}의 분모 = 9 − 5 = 4\n**함정**: c = √{5}이므로 c^{2} = 5를 바로 씁니다. 제곱근을 다시 제곱하는 단계에서 실수하지 않습니다.", "src": "실전 다지기 6"}, {"l": 2, "t": "self", "q": "⁣타원 위의 점에서 두 초점까지의 거리의 합이 일정한 이유를 '두 말뚝과 끈' 비유로 서술하시오.", "x": null, "s": "⁣**정답: 끈의 양 끝이 두 말뚝(초점)에 묶여 있고, 연필은 끈을 팽팽하게 당긴 채 움직인다. 연필이 어디에 있든 끈은 '연필 → 말뚝 F'와 '연필 → 말뚝 F′' 두 조각으로 나뉠 뿐 전체 길이는 변하지 않으므로, 두 초점까지의 거리의 합은 항상 끈의 길이 2a로 일정하다.**\n**신호 읽기**: 비유를 지정한 서술형 → '끈이 두 조각으로 나뉠 뿐 전체 길이는 그대로'가 핵심 문장입니다.\n**상황 번역**: 장축의 끝점에서는 끈이 한쪽으로 몰려 (a − c) + (a + c) = 2a, 단축의 끝점에서는 반으로 접혀 a + a = 2a입니다.\n**풀이**: 이 두 위치를 예로 들면 끈 길이가 왜 2a인지까지 설명됩니다.\n**함정**: '끈의 길이 = 장축의 길이'라는 연결을 빼먹지 않습니다.", "src": "실전 다지기 7"}, {"l": 3, "t": "sa", "q": "⁣두 초점이 (± 3, 0)이고 점 (5, 0)을 지나는 타원의 방정식이 {{x^{2}§a^{2}}} + {{y^{2}§b^{2}}} = 1일 때, b^{2}의 값을 구하시오.", "x": "16|16개|16가지", "s": "⁣**신호 읽기**: 장축의 끝점이 주어짐 → 끝점까지의 거리가 반장축 a\n**상황 번역**: 초점 (± 3, 0)이고 (5, 0)은 x축 위의 점이므로 장축의 끝점 → a = 5, c = 3\n**풀이**: b^{2} = a^{2} − c^{2} = 25 − 9 = 16\n**함정**: 정의로 확인: (5, 0)에서 두 초점까지 2 + 8 = 10 = 2a로 맞습니다.", "src": "실전 다지기 8"}, {"l": 3, "t": "sa", "q": "⁣타원 {{(x − 1)^{2}§9}} + {{(y + 2)^{2}§5}} = 1의 두 초점의 좌표를 구하시오.", "x": "(3, −2), (−1, −2)|(3,-2),(-1,-2)", "s": "⁣**신호 읽기**: (x − m)^{2}, (y − n)^{2} 꼴 → 평행이동한 타원. 중심부터 읽습니다.\n**상황 번역**: 중심 (1, −2). 모양은 {{x^{2}§9}} + {{y^{2}§5}} = 1과 같으므로 c^{2} = 9 − 5 = 4, 말뚝은 중심에서 x축 방향으로 ± 2\n**풀이**: (1 ± 2, −2) → (3, −2), (−1, −2)\n**함정**: 원래 타원의 초점 (± 2, 0)을 그대로 쓰면 틀립니다. 말뚝도 중심과 함께 이동합니다.", "src": "실전 다지기 9"}, {"l": 3, "t": "self", "q": "⁣타원 {{x^{2}§25}} + {{y^{2}§16}} = 1의 두 초점을 F, F′이라 할 때, 타원 위의 점 P에 대하여 삼각형 PF′ F의 둘레의 길이와 넓이의 최댓값을 구하시오. (단, 점 P는 x축 위에 있지 않다.)", "x": null, "s": "⁣**정답: 둘레 16, 넓이의 최댓값 12**\n**신호 읽기**: [고난도] 삼각형 PF′ F의 둘레 → 끈 + 말뚝 사이 거리. 넓이 최대 → 밑변 고정, 높이 최대\n**상황 번역**: a = 5, b = 4, c = 3. 둘레 = ‾{PF} + ‾{PF′} + ‾{FF′} = 2a + 2c. 밑변 ‾{FF′}은 고정이므로 점 P가 x축에서 가장 멀 때(단축의 끝점) 높이가 b로 최대\n**풀이**: 둘레 10 + 6 = 16. 넓이 최댓값 {{1§2}} × 6 × 4 = 12\n**함정**: 넓이를 구할 때 높이를 a로 쓰면 안 됩니다. 점 P의 y좌표가 높이이고, 그 최댓값은 b입니다.", "src": "실전 다지기 10"}]}, {"id": "sg3", "u": "SG1", "ex": "GE", "t": "두 기지국 시간차론", "sm": 1, "en": "Theory of the Time Gap", "th": [["p", "⁣두 기지국 F, F′에서 동시에 신호를 보냈는데, 내 휴대전화에 두 신호가 **항상 같은 시간차로** 도착한다면 나는 어디에 있을까요? 시간차가 일정하다는 것은 두 기지국까지 **거리의 차가 일정**하다는 뜻입니다. 이런 점들을 모두 이으면 두 갈래로 갈라져 서로 등을 진 곡선, 즉 **쌍곡선**이 생깁니다."], ["p", "⁣| ‾{PF} − ‾{PF′} | = 2a, {{x^{2}§a^{2}}} − {{y^{2}§b^{2}}} = 1 (b^{2} = c^{2} − a^{2})"], ["p", "⁣타원은 거리의 **합**이 일정해 두 초점을 감싸 안는 닫힌 곡선이었지만, 쌍곡선은 거리의 **차**가 일정해 두 초점을 하나씩 품고 바깥으로 뻗어 나가는 열린 곡선입니다. 그래서 타원은 a^{2} = b^{2} + c^{2}, 쌍곡선은 c^{2} = a^{2} + b^{2}로 관계가 뒤집힙니다. 멀리 갈수록 쌍곡선은 두 직선 y = ± {{b§a}}x에 한없이 가까워지며, 이를 **점근선**이라 합니다."], ["li", "⁣**1:1 매칭 기호 독해법**: ==\"두 초점으로부터 거리의 차\"== → 2a (주축의 길이). ==\"점근선\"== → 방정식의 우변 1을 0으로 바꾼 {{x^{2}§a^{2}}} − {{y^{2}§b^{2}}} = 0. 거리의 차 문제는 **어느 가지 위의 점인지**에 따라 더하거나 빼는 두 경우를 모두 확인합니다."], ["p", "⁣**[보충] 타원과 쌍곡선 대조표**"], ["tbl", [["⁣구분", "⁣타원", "⁣쌍곡선"], ["⁣정의", "⁣거리의 **합** = 2a", "⁣거리의 **차** = 2a"], ["⁣방정식", "⁣{{x^{2}§a^{2}}} + {{y^{2}§b^{2}}} = 1", "⁣{{x^{2}§a^{2}}} − {{y^{2}§b^{2}}} = 1"], ["⁣관계", "⁣c^{2} = a^{2} − b^{2}", "⁣c^{2} = a^{2} + b^{2}"], ["⁣모양", "⁣닫힌 곡선", "⁣두 갈래 열린 곡선, 점근선 y = ± {{b§a}}x"]]], ["p", "⁣**[보충] 초점이** y**축 위인 쌍곡선**: {{x^{2}§a^{2}}} − {{y^{2}§b^{2}}} = −1 또는 {{y^{2}§b^{2}}} − {{x^{2}§a^{2}}} = 1 꼴이며, 초점은 (0, ± c), 주축의 길이는 2b입니다."], ["p", "⁣**[보충] 점근선과 평행이동**: 초점이 y축 위에 있는 쌍곡선 {{x^{2}§a^{2}}} − {{y^{2}§b^{2}}} = −1의 점근선도 우변을 0으로 바꾼 y = ± {{b§a}}x로 같습니다. {{(x − m)^{2}§a^{2}}} − {{(y − n)^{2}§b^{2}}} = 1은 원래 쌍곡선을 x축 방향으로 m, y축 방향으로 n만큼 평행이동한 것이므로, 중심 (m, n)을 기준으로 초점과 점근선도 같은 만큼 옮겨 읽습니다."]], "sum": ["⁣신호: \"거리의 차\", \"점근선\" → **| ‾{PF} − ‾{PF′} | = 2a, c^{2} = a^{2} + b^{2}**", "⁣**1:1 매칭 기호 독해법**: ==\"두 초점으로부터 거리의 차\"== → 2a (주축의 길이). ==\"점근선\"== → 방정식의 우변 1을 0으로 바꾼 {{x^{2}§a^{2}}} − {{y^{2}§b^{2}}} = 0. 거리의 차 문제는 **어느 가지 위의 점인지**에 따라 더하거나 빼는 두 경우를 모두 확인합니다."], "fl": [["⁣\"거리의 차\", \"점근선\" — 이 신호를 보면 꺼낼 도구는?", "⁣| ‾{PF} − ‾{PF′} | = 2a, c^{2} = a^{2} + b^{2}"], ["⁣구분: 정의 → 타원 / 쌍곡선?", "⁣거리의 **합** = 2a / 거리의 **차** = 2a"], ["⁣구분: 방정식 → 타원 / 쌍곡선?", "⁣{{x^{2}§a^{2}}} + {{y^{2}§b^{2}}} = 1 / {{x^{2}§a^{2}}} − {{y^{2}§b^{2}}} = 1"], ["⁣구분: 관계 → 타원 / 쌍곡선?", "⁣c^{2} = a^{2} − b^{2} / c^{2} = a^{2} + b^{2}"], ["⁣구분: 모양 → 타원 / 쌍곡선?", "⁣닫힌 곡선 / 두 갈래 열린 곡선, 점근선 y = ± {{b§a}}x"]], "bk": {"q": "책을 덮고 「두 기지국 시간차론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["⁣신호 문장: \"거리의 차\", \"점근선\"", "⁣꺼낼 도구: | ‾{PF} − ‾{PF′} | = 2a, c^{2} = a^{2} + b^{2}", "⁣1:1 매칭 기호 독해법", "⁣기지국 위치", "⁣시간차 읽기", "⁣점근선"]}, "pr": [{"l": 3, "t": "self", "q": "⁣쌍곡선 {{x^{2}§9}} − {{y^{2}§16}} = 1의 ==초점의 좌표, 주축의 길이, 점근선의 방정식==을 구하시오.", "x": null, "s": "⁣**1. 기지국 위치** c^{2} = 9 + 16 = 25 → 초점 (± 5, 0)\n**2. 시간차 읽기** a = 3 → 주축의 길이 6\n**3. 점근선** {{x^{2}§9}} − {{y^{2}§16}} = 0 → y = ± {{4§3}}x", "ck": ["⁣기지국 위치", "⁣시간차 읽기", "⁣점근선"], "src": "태원고 기출 기반"}, {"l": 2, "t": "self", "q": "⁣==두 초점== (5, 0)==,== (−5, 0)==으로부터 거리의 차가 8==인 점이 나타내는 도형의 방정식을 구하시오.", "x": null, "s": "⁣**1. 시간차 읽기** 2a = 8에서 a = 4, c = 5\n**2. b^{2} 계산** b^{2} = c^{2} − a^{2} = 25 − 16 = 9\n**3. 정산** {{x^{2}§16}} − {{y^{2}§9}} = 1", "ck": ["⁣시간차 읽기", "⁣b^{2} 계산", "⁣정산"], "src": "분당 지역 고교 기출 스타일"}, {"l": 2, "t": "self", "q": "⁣==두 꼭짓점이== (± 1, 0)==이고 점근선이== y = ± 2x인 쌍곡선의 방정식을 구하시오.", "x": null, "s": "⁣**1. 꼭짓점 읽기** a = 1\n**2. 점근선 기울기 읽기** {{b§a}} = 2 → b = 2\n**3. 정산** x^{2} − {{y^{2}§4}} = 1", "ck": ["⁣꼭짓점 읽기", "⁣점근선 기울기 읽기", "⁣정산"], "src": "교과서 연계"}, {"l": 3, "t": "self", "q": "⁣쌍곡선 {{x^{2}§16}} − {{y^{2}§9}} = 1의 두 초점을 F(5, 0), F′(−5, 0)이라 하자. 쌍곡선 위의 점 P에 대하여 ‾{PF} = 10==일 때,== ‾{PF′}==의 값==을 모두 구하시오.", "x": null, "s": "⁣**1. 시간차 읽기** | ‾{PF} − ‾{PF′} | = 2a = 8\n**2. 두 가지 경우** 점 P가 왼쪽 가지 위에 있으면 F′에 더 가까우므로 ‾{PF′} = 10 − 8 = 2, 오른쪽 가지 위에 있으면 ‾{PF′} = 10 + 8 = 18\n**3. 정산 (존재 확인)** 초점에서 쌍곡선까지의 최소 거리는 c − a = 1이므로 2와 18 모두 가능합니다. ‾{PF′} = 2 또는 18", "ck": ["⁣시간차 읽기", "⁣두 가지 경우", "⁣정산 (존재 확인)"], "src": "태원고 스타일 적중 변형 문제"}, {"l": 1, "t": "sa", "q": "⁣쌍곡선 {{x^{2}§4}} − {{y^{2}§5}} = 1의 초점의 좌표를 구하시오.", "x": "(3, 0), (−3, 0)|(3,0),(-3,0)", "s": "⁣**신호 읽기**: 쌍곡선의 초점 → c^{2} = a^{2} + b^{2} (타원과 반대로 더하기)\n**상황 번역**: 거리의 차 2a가 두 기지국 사이 거리 2c보다 작아야 하므로 c가 가장 큽니다.\n**풀이**: c^{2} = 4 + 5 = 9 → c = 3\n**함정**: 타원처럼 빼면 c^{2} = −1이 되어 말이 안 됩니다. 이 부호 차이를 [보충] 대조표로 기억합니다.", "src": "실전 다지기 1"}, {"l": 1, "t": "self", "q": "⁣1번 문항의 쌍곡선의 점근선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: y = ± {{√{5}§2}}x**\n**신호 읽기**: \"점근선\" → 방정식의 우변 1을 0으로 바꿉니다.\n**상황 번역**: {{x^{2}§4}} − {{y^{2}§5}} = 0 → y^{2} = {{5§4}}x^{2}\n**풀이**: y = ± {{√{5}§2}}x\n**함정**: 기울기는 {{b§a}}이고, a, b는 분모의 제곱근입니다. {{5§4}}를 기울기로 쓰지 않습니다.", "src": "실전 다지기 2"}, {"l": 1, "t": "sa", "q": "⁣쌍곡선 {{x^{2}§9}} − {{y^{2}§7}} = 1의 두 초점을 F, F′이라 할 때, 쌍곡선 위의 점 P에 대하여 | ‾{PF} − ‾{PF′} |의 값을 구하시오.", "x": "6|6개|6가지", "s": "⁣**신호 읽기**: \"| ‾{PF} − ‾{PF′} |\" → 시간차(거리의 차) 2a를 그대로 묻습니다.\n**상황 번역**: a^{2} = 9 → a = 3\n**풀이**: 2a = 6\n**함정**: b^{2} = 7은 거리의 차와 관계가 없습니다. 차는 x^{2} 아래(주축 방향) 분모로만 정해집니다.", "src": "실전 다지기 3"}, {"l": 2, "t": "self", "q": "⁣두 초점이 (0, 5), (0, −5)이고 주축의 길이가 6인 쌍곡선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: {{y^{2}§9}} − {{x^{2}§16}} = 1**\n**신호 읽기**: 초점이 y축 위 → [보충] 초점이 y축 위인 쌍곡선. y^{2} 항이 양수입니다.\n**상황 번역**: 주축 6 → y 방향 3, c = 5\n**풀이**: x^{2}의 분모 = c^{2} − 3^{2} = 25 − 9 = 16 → {{y^{2}§9}} − {{x^{2}§16}} = 1\n**함정**: 쌍곡선에서는 분모의 크기가 아니라 '양수 항이 어느 문자인가'가 초점의 방향을 정합니다.", "src": "실전 다지기 4"}, {"l": 2, "t": "self", "q": "⁣쌍곡선 {{x^{2}§9}} − {{y^{2}§4}} = 1의 초점의 좌표를 구하시오.", "x": null, "s": "⁣**정답: (√{13}, 0), (−√{13}, 0)**\n**신호 읽기**: 1번과 같은 방법입니다.\n**상황 번역**: c^{2} = a^{2} + b^{2}\n**풀이**: c^{2} = 9 + 4 = 13\n**함정**: 같은 분모의 타원 {{x^{2}§9}} + {{y^{2}§4}} = 1이라면 c^{2} = 5입니다. 부호 하나로 초점이 달라집니다.", "src": "실전 다지기 5"}, {"l": 2, "t": "self", "q": "⁣두 초점이 (± 5, 0)이고 점근선이 y = ± {{3§4}}x인 쌍곡선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: {{x^{2}§16}} − {{y^{2}§9}} = 1**\n**신호 읽기**: 점근선 기울기 {{b§a}}와 c가 주어짐 → 두 조건으로 a, b를 구합니다.\n**상황 번역**: {{b§a}} = {{3§4}}이므로 a = 4k, b = 3k로 두면 c^{2} = a^{2} + b^{2} = 25k^{2} = 25\n**풀이**: k = 1 → a^{2} = 16, b^{2} = 9\n**함정**: 비율 조건은 a = 4k, b = 3k처럼 하나의 문자로 두면 계산이 간단해집니다.", "src": "실전 다지기 6"}, {"l": 2, "t": "self", "q": "⁣타원은 c^{2} = a^{2} − b^{2}, 쌍곡선은 c^{2} = a^{2} + b^{2}로 관계가 달라지는 이유를 '거리의 합과 차' 관점에서 서술하시오.", "x": null, "s": "⁣**정답: 타원에서는 거리의 합(끈 길이 2a)이 두 초점 사이 거리 2c보다 커야 끈이 팽팽해지므로 a > c이고, c^{2} = a^{2} − b^{2}가 된다. 쌍곡선에서는 삼각형 PFF′에서 두 변의 차 2a가 나머지 한 변 2c보다 작아야 하므로 c > a이고, c^{2} = a^{2} + b^{2}가 된다. 어느 쪽이 큰지가 반대이므로 관계식의 부호도 뒤집힌다.**\n**신호 읽기**: 두 관계식의 차이를 '합과 차'로 설명하는 서술형 → 삼각형의 변의 길이 조건을 씁니다.\n**상황 번역**: 삼각형에서 두 변의 합은 나머지 한 변보다 크고, 두 변의 차는 나머지 한 변보다 작습니다.\n**풀이**: 그래서 타원은 a가 가장 크고, 쌍곡선은 c가 가장 크다는 결론을 씁니다.\n**함정**: 공식만 나란히 쓰면 이유가 없습니다. '누가 가장 큰가'의 근거를 씁니다.", "src": "실전 다지기 7"}, {"l": 3, "t": "self", "q": "⁣쌍곡선 x^{2} − y^{2} = 1의 초점의 좌표와 점근선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: 초점 (± √{2}, 0), 점근선 y = ± x**\n**신호 읽기**: 분모가 1인 쌍곡선 → a = b = 1\n**상황 번역**: c^{2} = 1 + 1, 점근선 기울기 {{b§a}} = 1\n**풀이**: 초점 (± √{2}, 0), 점근선 y = ± x\n**함정**: a = b인 쌍곡선은 두 점근선이 서로 수직입니다(기울기의 곱 − 1).", "src": "실전 다지기 8"}, {"l": 3, "t": "sa", "q": "⁣쌍곡선 {{x^{2}§4}} − {{y^{2}§12}} = 1의 두 초점을 F(4, 0), F′(−4, 0)이라 하자. 오른쪽 가지 위의 점 P에 대하여 ‾{PF′} = 9일 때, ‾{PF}의 값을 구하시오.", "x": "5|5개|5가지", "s": "⁣**신호 읽기**: 거리의 차 문제에서 \"오른쪽 가지 위의 점\" → 어느 초점이 가까운지가 정해집니다.\n**상황 번역**: 오른쪽 가지는 오른쪽 초점 F(4, 0)에 더 가까우므로 ‾{PF′} − ‾{PF} = 2a\n**풀이**: a = 2 → 9 − ‾{PF} = 4 → ‾{PF} = 5\n**함정**: 가지가 정해지지 않았다면 9 ± 4 두 경우를 모두 검토해야 합니다(예제 4). 이 문제는 가지가 정해져 하나입니다.", "src": "실전 다지기 9"}, {"l": 3, "t": "sa", "q": "⁣쌍곡선 {{(x − 2)^{2}§9}} − {{(y + 1)^{2}§7}} = 1의 두 초점의 좌표를 구하시오.", "x": "(6, −1), (−2, −1)|(6,-1),(-2,-1)", "s": "⁣**신호 읽기**: [고난도] 평행이동한 쌍곡선 → [보충] 점근선과 평행이동. 중심부터 읽습니다.\n**상황 번역**: 중심 (2, −1). 모양은 {{x^{2}§9}} − {{y^{2}§7}} = 1과 같아 c^{2} = 9 + 7 = 16, 기지국은 중심에서 x축 방향으로 ± 4\n**풀이**: (2 ± 4, −1) → (6, −1), (−2, −1)\n**함정**: 원래 초점 (± 4, 0)에 중심의 이동을 더해 줍니다. y좌표 − 1도 함께 옮깁니다.", "src": "실전 다지기 10"}]}, {"id": "sg4", "u": "SG1", "ex": "GE", "t": "스치는 순간 한 점론", "sm": 1, "en": "Theory of the Single Touch", "th": [["p", "⁣곧은 막대(직선)를 곡선 쪽으로 천천히 밀어 본다고 상상해 보세요. 멀리 있을 때는 만나지 않고(교점 0개), 너무 깊이 밀면 곡선을 꿰뚫어 두 점에서 만납니다(교점 2개). 그 사이에 **딱 한 점에서 스치는 순간**이 있는데, 이때의 직선이 **접선**입니다."], ["p", "⁣교점의 개수는 직선의 식을 곡선의 식에 대입해 만든 이차방정식의 **실근의 개수**와 같습니다. 그러므로 \"접한다\"는 문장은 \"이 이차방정식이 중근을 가진다\", 즉 **판별식** D = 0으로 번역됩니다. 공통수학1에서 이차함수와 직선이 접할 때 쓰던 도구를 이차곡선에서도 그대로 다시 꺼내는 것입니다."], ["li", "⁣**1:1 매칭 기호 독해법**: ==\"기울기가== m==인 접선\"== → y = mx + n으로 두고 대입 후 D = 0으로 n 찾기. ==\"곡선 위의 점== (x_{1}, y_{1})==에서의 접선\"== → y = m(x − x_{1}) + y_{1}로 두고 대입 후 D = 0으로 m 찾기. ==\"곡선 밖의 점에서 그은 접선\"== → 같은 방법, 보통 기울기가 두 개 나온다."], ["p", "⁣**[보충] 판별식 절차표**"], ["tbl", [["⁣단계", "⁣할 일", "⁣주의"], ["⁣1", "⁣직선을 미지수 하나로 세우기", "⁣기울기를 알면 y절편을, 점을 알면 기울기를 미지수로"], ["⁣2", "⁣곡선의 식에 대입", "⁣한 문자에 대한 이차방정식으로 정리"], ["⁣3", "⁣D = 0 (또는 {{D§4}} = 0)", "⁣이차항의 계수가 0이 아닌지 확인"], ["⁣4", "⁣미지수 구하기 → 접선 완성", "⁣해가 두 개면 접선도 두 개"]]], ["p", "⁣**[보충] 이차항 계수를 확인하는 이유**: 쌍곡선의 점근선과 기울기가 같은 직선을 대입하면 이차항이 사라져 일차방정식이 됩니다. 이때 교점은 많아야 1개이지만 곡선을 스치는 것이 아니라 가로지르는 것이므로 접선이 아닙니다. 판별식은 이차방정식일 때만 쓸 수 있습니다."]], "sum": ["⁣신호: \"접한다\", \"접선의 방정식\" → **대입 후 판별식 D = 0**", "⁣**1:1 매칭 기호 독해법**: ==\"기울기가== m==인 접선\"== → y = mx + n으로 두고 대입 후 D = 0으로 n 찾기. ==\"곡선 위의 점== (x_{1}, y_{1})==에서의 접선\"== → y = m(x − x_{1}) + y_{1}로 두고 대입 후 D = 0으로 m 찾기. ==\"곡선 밖의 점에서 그은 접선\"== → 같은 방법, 보통 기울기가 두 개 나온다."], "fl": [["⁣\"접한다\", \"접선의 방정식\" — 이 신호를 보면 꺼낼 도구는?", "⁣대입 후 판별식 D = 0"], ["⁣단계: 1 → 할 일 / 주의?", "⁣직선을 미지수 하나로 세우기 / 기울기를 알면 y절편을, 점을 알면 기울기를 미지수로"], ["⁣단계: 2 → 할 일 / 주의?", "⁣곡선의 식에 대입 / 한 문자에 대한 이차방정식으로 정리"], ["⁣단계: 3 → 할 일 / 주의?", "⁣D = 0 (또는 {{D§4}} = 0) / 이차항의 계수가 0이 아닌지 확인"], ["⁣단계: 4 → 할 일 / 주의?", "⁣미지수 구하기 → 접선 완성 / 해가 두 개면 접선도 두 개"]], "bk": {"q": "책을 덮고 「스치는 순간 한 점론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["⁣신호 문장: \"접한다\", \"접선의 방정식\"", "⁣꺼낼 도구: 대입 후 판별식 D = 0", "⁣1:1 매칭 기호 독해법", "⁣막대 세우기", "⁣대입 후 정리", "⁣스치는 순간 (D = 0)"]}, "pr": [{"l": 3, "t": "self", "q": "⁣포물선 y^{2} = 8x에 접하고 ==기울기가 2인 직선==의 방정식을 구하시오.", "x": null, "s": "⁣**1. 막대 세우기** y = 2x + n으로 둡니다.\n**2. 대입 후 정리** (2x + n)^{2} = 8x → 4x^{2} + (4n − 8)x + n^{2} = 0\n**3. 스치는 순간 (D = 0)** {{D§4}} = (2n − 4)^{2} − 4n^{2} = −16n + 16 = 0 → n = 1, 접선 y = 2x + 1", "ck": ["⁣막대 세우기", "⁣대입 후 정리", "⁣스치는 순간 (D = 0)"], "src": "태원고 기출 기반"}, {"l": 2, "t": "self", "q": "⁣타원 {{x^{2}§4}} + y^{2} = 1에 접하고 ==기울기가 1인 직선==의 방정식을 구하시오.", "x": null, "s": "⁣**1. 막대 세우기** y = x + n으로 둡니다.\n**2. 대입 후 정리** {{x^{2}§4}} + (x + n)^{2} = 1 → 5x^{2} + 8nx + 4n^{2} − 4 = 0\n**3. 스치는 순간 (D = 0)** {{D§4}} = 16n^{2} − 5(4n^{2} − 4) = −4n^{2} + 20 = 0 → n = ± √{5}, 접선 y = x ± √{5}", "ck": ["⁣막대 세우기", "⁣대입 후 정리", "⁣스치는 순간 (D = 0)"], "src": "분당 지역 고교 기출 스타일"}, {"l": 2, "t": "self", "q": "⁣포물선 y^{2} = 4x ==위의 점== (1, 2)==에서의 접선==의 방정식을 구하시오.", "x": null, "s": "⁣**1. 막대 세우기** 점 (1, 2)를 지나므로 y = m(x − 1) + 2\n**2. 대입 후 정리** x = {{y^{2}§4}}를 대입하면 y = m({{y^{2}§4}} − 1) + 2 → my^{2} − 4y + 8 − 4m = 0\n**3. 스치는 순간 (D = 0)** {{D§4}} = 4 − m(8 − 4m) = 4(m − 1)^{2} = 0 → m = 1, 접선 y = x + 1", "ck": ["⁣막대 세우기", "⁣대입 후 정리", "⁣스치는 순간 (D = 0)"], "src": "교과서 연계"}, {"l": 3, "t": "self", "q": "⁣쌍곡선 x^{2} − {{y^{2}§3}} = 1에 접하고 ==기울기가 2인 직선==의 방정식을 모두 구하시오.", "x": null, "s": "⁣**1. 막대 세우기** y = 2x + n으로 둡니다.\n**2. 대입 후 정리** 3x^{2} − (2x + n)^{2} = 3 → x^{2} + 4nx + n^{2} + 3 = 0\n**3. 스치는 순간 (D = 0)** {{D§4}} = 4n^{2} − (n^{2} + 3) = 3n^{2} − 3 = 0 → n = ± 1, 접선 y = 2x ± 1", "ck": ["⁣막대 세우기", "⁣대입 후 정리", "⁣스치는 순간 (D = 0)"], "src": "태원고 스타일 적중 변형 문제"}, {"l": 1, "t": "sa", "q": "⁣포물선 y^{2} = 4x에 접하고 기울기가 1인 직선의 방정식을 판별식을 이용하여 구하시오.", "x": "y = x + 1|y=x+1|x+1", "s": "⁣**신호 읽기**: \"기울기가 1인 접선\" → y = x + n으로 막대를 세우고, 대입 후 D = 0으로 n을 찾습니다.\n**상황 번역**: 막대(직선)를 위아래로 밀다가 포물선을 딱 한 점에서 스치는 순간을 찾습니다.\n**풀이**: (x + n)^{2} = 4x → x^{2} + (2n − 4)x + n^{2} = 0. {{D§4}} = (n − 2)^{2} − n^{2} = −4n + 4 = 0 → n = 1\n**함정**: 이차방정식으로 정리할 때 모든 항을 한쪽으로 옮긴 뒤 판별식을 씁니다.", "src": "실전 다지기 1"}, {"l": 1, "t": "sa", "q": "⁣포물선 x^{2} = 4y에 접하고 기울기가 1인 직선의 방정식을 구하시오.", "x": "y = x − 1|y=x-1|x-1", "s": "⁣**신호 읽기**: 1번과 같은 절차, 위로 열린 포물선입니다.\n**상황 번역**: y = x + n을 x^{2} = 4y에 대입\n**풀이**: x^{2} = 4x + 4n → x^{2} − 4x − 4n = 0. {{D§4}} = 4 + 4n = 0 → n = −1\n**함정**: 대입할 문자를 고를 때, 식이 x에 대한 이차방정식이 되도록 y를 바꿔 넣습니다.", "src": "실전 다지기 2"}, {"l": 1, "t": "self", "q": "⁣타원 {{x^{2}§9}} + {{y^{2}§4}} = 1에 접하고 기울기가 1인 직선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: y = x ± √{13}**\n**신호 읽기**: 타원의 접선 → 같은 절차. 타원은 닫힌 곡선이라 같은 기울기의 접선이 위아래로 두 개 나옵니다.\n**상황 번역**: 분모를 없애려고 양변에 36을 곱한 식 4x^{2} + 9y^{2} = 36에 대입합니다.\n**풀이**: 4x^{2} + 9(x + n)^{2} = 36 → 13x^{2} + 18nx + 9n^{2} − 36 = 0. {{D§4}} = 81n^{2} − 13(9n^{2} − 36) = −36n^{2} + 468 = 0 → n^{2} = 13\n**함정**: 분수 그대로 계산하면 실수가 많습니다. 먼저 분모를 없앱니다.", "src": "실전 다지기 3"}, {"l": 2, "t": "sa", "q": "⁣포물선 y^{2} = 8x 위의 점 (2, 4)에서의 접선의 방정식을 구하시오.", "x": "y = x + 2|y=x+2|x+2", "s": "⁣**신호 읽기**: \"곡선 위의 점에서의 접선\" → 점은 알고 기울기를 모르므로 y = m(x − 2) + 4로 세우고 D = 0으로 m을 찾습니다.\n**상황 번역**: 막대를 점 (2, 4)에 꽂은 채 돌리다가 포물선을 스치는 순간을 찾습니다.\n**풀이**: x = {{y^{2}§8}}을 대입 → y = m({{y^{2}§8}} − 2) + 4 → my^{2} − 8y + 32 − 16m = 0. {{D§4}} = 16 − m(32 − 16m) = 16(m − 1)^{2} = 0 → m = 1 → y = x + 2\n**함정**: y^{2} = 8x는 x를 y로 나타내기 쉬우므로 y에 대한 이차방정식을 만드는 것이 계산이 짧습니다.", "src": "실전 다지기 4"}, {"l": 2, "t": "self", "q": "⁣쌍곡선 {{x^{2}§4}} − y^{2} = 1에 접하고 기울기가 1인 직선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: y = x ± √{3}**\n**신호 읽기**: 쌍곡선의 접선 → 같은 절차. 단, [보충]대로 이차항 계수가 0이 아닌지 확인합니다.\n**상황 번역**: 점근선 기울기는 ± {{1§2}}이고 접선 기울기 1과 다르므로 이차항이 사라지지 않습니다.\n**풀이**: x^{2} − 4(x + n)^{2} = 4 → 3x^{2} + 8nx + 4n^{2} + 4 = 0. {{D§4}} = 16n^{2} − 3(4n^{2} + 4) = 4n^{2} − 12 = 0 → n^{2} = 3\n**함정**: 전개 후 이차항 x^{2} − 4x^{2} = −3x^{2}의 부호를 정리하면서 전체에 − 1을 곱하는 단계를 조심합니다.", "src": "실전 다지기 5"}, {"l": 2, "t": "self", "q": "⁣직선 y = x + k가 타원 {{x^{2}§3}} + y^{2} = 1에 접할 때, 상수 k의 값을 구하시오.", "x": null, "s": "⁣**정답: k = ± 2**\n**신호 읽기**: \"접할 때 상수 k\" → 막대의 높이 k를 미지수로 두고 D = 0\n**상황 번역**: x^{2} + 3y^{2} = 3에 y = x + k를 대입\n**풀이**: 4x^{2} + 6kx + 3k^{2} − 3 = 0. {{D§4}} = 9k^{2} − 4(3k^{2} − 3) = −3k^{2} + 12 = 0 → k^{2} = 4\n**함정**: 타원은 위아래로 하나씩 접선이 있으므로 ± 두 값이 모두 답입니다.", "src": "실전 다지기 6"}, {"l": 2, "t": "self", "q": "⁣직선이 이차곡선에 접하는 조건을 판별식 D = 0으로 바꾸어 쓰는 이유를 '스치는 순간' 비유로 서술하시오.", "x": null, "s": "⁣**정답: 직선과 곡선의 교점의 개수는 직선의 식을 곡선의 식에 대입해 얻은 이차방정식의 실근의 개수와 같다. 막대를 밀어 곡선에 딱 한 점에서 스치는 순간은 교점이 1개인 순간이므로 이차방정식이 중근을 갖는 순간, 즉 판별식이 0인 순간이다.**\n**신호 읽기**: 비유를 지정한 서술형 → '교점 개수 = 실근 개수'라는 연결이 핵심입니다.\n**상황 번역**: 막대가 멀리 있으면 교점 0개(D < 0), 꿰뚫으면 2개(D > 0), 그 사이의 경계가 스치는 순간(D = 0)입니다.\n**풀이**: 세 경우를 함께 쓰면 '경계'라는 의미가 분명해집니다.\n**함정**: 이차항이 사라지는 경우(쌍곡선의 점근선과 평행)에는 판별식을 쓸 수 없다는 [보충] 내용을 덧붙이면 완성도가 높습니다.", "src": "실전 다지기 7"}, {"l": 3, "t": "sa", "q": "⁣직선 y = mx + 1이 포물선 y^{2} = 4x에 접할 때, 상수 m의 값을 구하시오.", "x": "m = 1|m=1|1", "s": "⁣**신호 읽기**: 막대의 기울기 m이 미지수, 높이는 1로 고정 → 대입 후 D = 0\n**상황 번역**: 점 (0, 1)에 막대를 꽂고 돌리다가 포물선을 스치는 순간\n**풀이**: (mx + 1)^{2} = 4x → m^{2}x^{2} + (2m − 4)x + 1 = 0. {{D§4}} = (m − 2)^{2} − m^{2} = −4m + 4 = 0 → m = 1\n**함정**: m = 0이면 이차항이 사라집니다. 이때 y = 1은 포물선과 한 점에서 만나지만 가로지르는 것이라 접선이 아닙니다.", "src": "실전 다지기 8"}, {"l": 3, "t": "sa", "q": "⁣직선 y = mx + 3이 타원 x^{2} + {{y^{2}§4}} = 1에 접할 때, m^{2}의 값을 구하시오.", "x": "5|5개|5가지", "s": "⁣**신호 읽기**: 8번과 같은 절차, 타원입니다.\n**상황 번역**: 4x^{2} + y^{2} = 4에 y = mx + 3 대입\n**풀이**: 4x^{2} + (mx + 3)^{2} = 4 → (m^{2} + 4)x^{2} + 6mx + 5 = 0. {{D§4}} = 9m^{2} − 5(m^{2} + 4) = 4m^{2} − 20 = 0 → m^{2} = 5\n**함정**: 점 (0, 3)은 타원 밖에 있으므로 접선이 두 개(m = ± √{5}) 있습니다. 문제는 m^{2}을 물었습니다.", "src": "실전 다지기 9"}, {"l": 3, "t": "self", "q": "⁣점 (0, 2)에서 타원 {{x^{2}§3}} + y^{2} = 1에 그은 두 접선의 기울기를 구하고, 두 접선이 서로 수직임을 보이시오.", "x": null, "s": "⁣**정답: 기울기 1, − 1, 두 기울기의 곱이 − 1이므로 수직**\n**신호 읽기**: [고난도] \"곡선 밖의 점에서 그은 두 접선\" → 기울기를 미지수로 두면 D = 0에서 이차방정식이 나오고, 두 근이 두 접선의 기울기입니다.\n**상황 번역**: 점 (0, 2)에 막대를 꽂고 돌리면 타원을 스치는 순간이 두 번 있습니다.\n**풀이**: x^{2} + 3(mx + 2)^{2} = 3 → (1 + 3m^{2})x^{2} + 12mx + 9 = 0. {{D§4}} = 36m^{2} − 9(1 + 3m^{2}) = 9m^{2} − 9 = 0 → m = ± 1. 기울기의 곱 1 × (−1) = −1이므로 두 접선은 서로 수직\n**함정**: 수직 조건은 기울기의 곱이 − 1입니다(공통수학2 유형 1). 두 기울기의 합이 0인 것은 수직의 근거가 아닙니다.", "src": "실전 다지기 10"}]}, {"id": "sg5", "u": "SG2", "ex": "GE", "t": "한낮의 그림자론", "sm": 1, "en": "Theory of the Noon Shadow", "th": [["p", "⁣한낮에 햇빛이 땅에 수직으로 내리쬐면, 비스듬히 세운 판자의 그림자는 판자보다 작아집니다. 판자를 땅과 나란히 눕히면 그림자는 판자와 똑같고, 땅에 수직으로 세우면 그림자는 선분 하나로 줄어듭니다. 이 그림자가 **정사영**입니다. 판자와 땅이 이루는 각을 θ라 하면 그림자는 기울어진 방향으로만 cos θ배 줄어들므로"], ["p", "⁣S′ = Scos θ, l′ = lcos θ"], ["p", "⁣또 하나의 핵심 장면은 **삼수선의 정리**입니다. 평면 밖의 점 P에서 평면에 수선 PO를 내리고, O에서 평면 위의 직선 l에 수선 OH를 그으면 PH ⊥ l이 됩니다. 그림자(OH)가 직선과 수직이면 실물(PH)도 직선과 수직이라는 뜻입니다. 이때 삼각형 POH는 ∠ POH = 90^{°}인 직각삼각형이므로 피타고라스 정리를 바로 쓸 수 있습니다."], ["li", "⁣**1:1 매칭 기호 독해법**: ==\"정사영의 넓이(길이)\"== → 원래 넓이(길이) × cos θ. ==\"두 평면이 이루는 각\"== → (그림자 넓이) ÷ (원래 넓이) = cos θ로 거꾸로 구하기. ==\"평면에 수직\", \"직선에 수직\"== 두 수직이 이어지면 → 삼수선의 정리로 세 번째 수직 찾기."], ["p", "⁣**[보충] 공간에서의 위치 관계 정리표**"], ["tbl", [["⁣대상", "⁣위치 관계"], ["⁣두 직선", "⁣한 점에서 만난다 / 평행하다 / 꼬인 위치에 있다"], ["⁣직선과 평면", "⁣직선이 평면에 포함된다 / 한 점에서 만난다 / 평행하다"], ["⁣두 평면", "⁣한 직선에서 만난다 / 평행하다"]]], ["p", "⁣**[보충] 꼬인 위치**: 만나지도 않고 평행하지도 않은 두 직선입니다. 같은 평면 위에 놓을 수 없다는 점이 평면도형과 공간도형을 가르는 가장 큰 차이입니다."], ["p", "⁣**[보충] 수직과 각의 뜻**: 직선 l이 평면 α 위의 **만나는 두 직선**과 각각 수직이면 l은 평면 α와 수직이고, 이때 l은 평면 위의 모든 직선과 수직입니다. 두 평면이 이루는 각은 두 평면의 교선 위의 한 점에서 각 평면 위에 교선과 수직인 직선을 하나씩 그었을 때, 그 두 직선이 이루는 각입니다. 두 평면이 수직이면 한 평면 위에서 교선에 수직인 직선은 다른 평면과도 수직입니다."]], "sum": ["⁣신호: \"정사영\", \"수직\", \"이루는 각\" → **S′ = Scos θ, 삼수선의 정리**", "⁣**1:1 매칭 기호 독해법**: ==\"정사영의 넓이(길이)\"== → 원래 넓이(길이) × cos θ. ==\"두 평면이 이루는 각\"== → (그림자 넓이) ÷ (원래 넓이) = cos θ로 거꾸로 구하기. ==\"평면에 수직\", \"직선에 수직\"== 두 수직이 이어지면 → 삼수선의 정리로 세 번째 수직 찾기."], "fl": [["⁣\"정사영\", \"수직\", \"이루는 각\" — 이 신호를 보면 꺼낼 도구는?", "⁣S′ = Scos θ, 삼수선의 정리"], ["⁣대상: 두 직선 → 위치 관계?", "⁣한 점에서 만난다 / 평행하다 / 꼬인 위치에 있다"], ["⁣대상: 직선과 평면 → 위치 관계?", "⁣직선이 평면에 포함된다 / 한 점에서 만난다 / 평행하다"], ["⁣대상: 두 평면 → 위치 관계?", "⁣한 직선에서 만난다 / 평행하다"]], "bk": {"q": "책을 덮고 「한낮의 그림자론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["⁣신호 문장: \"정사영\", \"수직\", \"이루는 각\"", "⁣꺼낼 도구: S′ = Scos θ, 삼수선의 정리", "⁣1:1 매칭 기호 독해법", "⁣그림자 장면 번역", "⁣공식 적용", "⁣정산"]}, "pr": [{"l": 3, "t": "self", "q": "⁣넓이가 10인 삼각형이 평면 α와 60^{°}의 각을 이룰 때, 이 삼각형의 ==평면== α ==위로의 정사영의 넓이==를 구하시오.", "x": null, "s": "⁣**1. 그림자 장면 번역** 기울어진 판자의 그림자는 cos θ배로 줄어듭니다.\n**2. 공식 적용** S′ = 10 × cos 60^{°}\n**3. 정산** 10 × {{1§2}} = 5", "ck": ["⁣그림자 장면 번역", "⁣공식 적용", "⁣정산"], "src": "태원고 기출 기반"}, {"l": 2, "t": "self", "q": "⁣넓이가 12인 도형의 평면 β 위로의 정사영의 넓이가 6√{3}일 때, 이 도형을 포함하는 평면과 평면 β가 ==이루는 각의 크기==를 구하시오.", "x": null, "s": "⁣**1. 공식 거꾸로 쓰기** S′ = Scos θ에서 cos θ = {{S′§S}}\n**2. 비율 계산** cos θ = {{6√{3}§12}} = {{√{3}§2}}\n**3. 정산** θ = 30^{°}", "ck": ["⁣공식 거꾸로 쓰기", "⁣비율 계산", "⁣정산"], "src": "분당 지역 고교 기출 스타일"}, {"l": 2, "t": "self", "q": "⁣평면 α 밖의 점 P에서 평면 α에 내린 수선의 발을 O, 점 O에서 평면 α 위의 직선 l에 내린 수선의 발을 H라 하자. ‾{PO} = 4==,== ‾{OH} = 3일 때, ‾{PH}의 길이를 구하시오.", "x": null, "s": "⁣**1. 삼수선 장면** PO ⊥ α, OH ⊥ l이므로 삼수선의 정리에 의해 PH ⊥ l\n**2. 직각삼각형 찾기** PO ⊥ α이므로 PO ⊥ OH, 삼각형 POH는 직각삼각형\n**3. 정산** ‾{PH} = √{4^{2} + 3^{2}} = 5", "ck": ["⁣삼수선 장면", "⁣직각삼각형 찾기", "⁣정산"], "src": "교과서 연계"}, {"l": 3, "t": "self", "q": "⁣한 변의 길이가 2인 정사각형 ABCD를 대각선 BD를 접는 선으로 하여 접었더니 ==평면== ABD==와 평면== CBD==가 서로 수직==이 되었다. 이때 선분 AC의 길이를 구하시오.", "x": null, "s": "⁣**1. 접기 전 길이** 대각선 BD의 중점을 O라 하면 ‾{AO} = ‾{CO} = √{2}, AO ⊥ BD, CO ⊥ BD\n**2. 수직 평면 번역** 두 평면이 수직이고 AO ⊥ BD이므로 AO ⊥ (평면 CBD), 따라서 AO ⊥ CO\n**3. 정산** ‾{AC} = √{(√{2})^{2} + (√{2})^{2}} = 2", "ck": ["⁣접기 전 길이", "⁣수직 평면 번역", "⁣정산"], "src": "태원고 스타일 적중 변형 문제"}, {"l": 1, "t": "self", "q": "⁣공간에서 서로 다른 두 직선의 위치 관계 세 가지를 쓰시오.", "x": null, "s": "⁣**정답: 한 점에서 만난다, 평행하다, 꼬인 위치에 있다**\n**신호 읽기**: 공간에서 두 직선의 위치 관계 → [보충] 위치 관계 정리표 첫 줄\n**상황 번역**: 같은 평면 위에 있으면 '만나거나 평행'이고, 같은 평면 위에 놓을 수 없으면 '꼬인 위치'입니다.\n**풀이**: 한 점에서 만난다 / 평행하다 / 꼬인 위치에 있다\n**함정**: 평면에서는 두 가지뿐이지만 공간에서는 꼬인 위치가 더해집니다. 이것이 공간도형의 출발점입니다.", "src": "실전 다지기 1"}, {"l": 1, "t": "sa", "q": "⁣정육면체 ABCD-EFGH에서 모서리 AB와 꼬인 위치에 있는 모서리의 개수를 구하시오.", "x": "4개|4|4가지", "s": "⁣**신호 읽기**: \"꼬인 위치에 있는 모서리\" → 만나지도, 평행하지도 않은 모서리를 셉니다.\n**상황 번역**: 정육면체 12개 모서리 중 AB 자신, AB와 평행한 것, AB와 만나는 것을 빼면 남는 것이 꼬인 위치입니다.\n**풀이**: 평행 DC, EF, HG(3개), 만남 AD, AE, BC, BF(4개). 12 − 1 − 3 − 4 = 4 → CG, DH, EH, FG\n**함정**: 하나씩 세면 빠뜨리기 쉽습니다. '전체에서 빼기'로 세면 정확합니다.", "src": "실전 다지기 2"}, {"l": 1, "t": "self", "q": "⁣넓이가 12인 도형이 평면 α와 45^{°}의 각을 이룰 때, 평면 α 위로의 정사영의 넓이를 구하시오.", "x": null, "s": "⁣**정답: 6√{2}**\n**신호 읽기**: \"정사영의 넓이\" → 원래 넓이 × cos θ\n**상황 번역**: 판자가 땅과 45^{°} 기울어져 있으면 그림자는 한 방향으로 cos 45^{°}배 줄어듭니다.\n**풀이**: 12 × {{√{2}§2}} = 6√{2}\n**함정**: sin을 곱하지 않습니다. 기울어진 각이 0이면 그림자가 원래와 같아야 하므로 cos 0^{°} = 1이 맞는 도구입니다.", "src": "실전 다지기 3"}, {"l": 2, "t": "self", "q": "⁣넓이가 8인 도형의 평면 α 위로의 정사영의 넓이가 4일 때, 도형을 포함하는 평면과 평면 α가 이루는 각의 크기를 구하시오.", "x": null, "s": "⁣**정답: 60^{°}**\n**신호 읽기**: 넓이와 그림자 넓이가 주어지고 각을 묻습니다 → 공식을 거꾸로 씁니다.\n**상황 번역**: cos θ = {{그림자 넓이§원래 넓이}}\n**풀이**: cos θ = {{4§8}} = {{1§2}} → θ = 60^{°}\n**함정**: 그림자는 원래보다 클 수 없으므로 비율은 항상 1 이하입니다.", "src": "실전 다지기 4"}, {"l": 2, "t": "sa", "q": "⁣평면 α 밖의 점 P에서 평면 α에 내린 수선의 발을 O, 점 O에서 평면 α 위의 직선 l에 내린 수선의 발을 H라 하자. ‾{PO} = 12, ‾{OH} = 5일 때, ‾{PH}의 길이를 구하시오.", "x": "13|13개|13가지", "s": "⁣**신호 읽기**: 평면에 수직, 직선에 수직이 이어짐 → 삼수선의 정리 + 직각삼각형 POH\n**상황 번역**: PO ⊥ α이므로 평면 위의 직선 OH와도 수직 → ∠ POH = 90^{°}\n**풀이**: ‾{PH} = √{12^{2} + 5^{2}} = 13\n**함정**: 직각이 어디에 있는지(O) 정확히 찾아야 빗변(PH)을 바르게 정할 수 있습니다.", "src": "실전 다지기 5"}, {"l": 2, "t": "self", "q": "⁣길이가 6인 선분의 평면 α 위로의 정사영의 길이가 3일 때, 선분과 평면 α가 이루는 각의 크기를 구하시오.", "x": null, "s": "⁣**정답: 60^{°}**\n**신호 읽기**: 선분의 정사영 → 길이도 cos θ배\n**상황 번역**: 막대의 그림자 길이\n**풀이**: cos θ = {{3§6}} = {{1§2}} → 60^{°}\n**함정**: 선분과 평면이 이루는 각은 선분과 그 그림자가 이루는 각입니다.", "src": "실전 다지기 6"}, {"l": 2, "t": "self", "q": "⁣정사영의 넓이가 원래 넓이의 cos θ배가 되는 이유를 '한낮의 그림자' 비유로 서술하시오.", "x": null, "s": "⁣**정답: 햇빛이 땅에 수직으로 내리쬘 때, 땅과 θ만큼 기울어진 판자의 그림자는 기울어진 방향의 길이만 cos θ배로 줄어들고, 기울기와 수직인 방향(두 평면의 교선 방향)의 길이는 그대로이다. 한 방향만 cos θ배가 되므로 넓이도 cos θ배가 된다.**\n**신호 읽기**: 비유를 지정한 서술형 → '한 방향만 줄어든다'가 핵심 문장입니다.\n**상황 번역**: 직사각형 판자를 교선과 나란히 놓고 생각하면, 가로는 그대로, 세로만 cos θ배입니다.\n**풀이**: θ = 0^{°}이면 그림자 = 판자, θ = 90^{°}이면 그림자 넓이 0이라는 양 끝 확인을 덧붙이면 좋습니다.\n**함정**: \"줄어드니까 cos\"라고만 쓰면 근거가 부족합니다. 어느 방향이 줄고 어느 방향이 그대로인지 씁니다.", "src": "실전 다지기 7"}, {"l": 3, "t": "sa", "q": "⁣5번 문항과 같은 상황에서 ‾{PH} = 10, ‾{PO} = 6일 때, ‾{OH}의 길이를 구하시오.", "x": "8|8개|8가지", "s": "⁣**신호 읽기**: 5번과 같은 삼수선 장면, 이번에는 다른 변을 구합니다.\n**상황 번역**: 빗변 PH = 10, 한 변 PO = 6인 직각삼각형\n**풀이**: ‾{OH} = √{100 − 36} = 8\n**함정**: 빗변은 직각(O)의 맞은편인 PH입니다.", "src": "실전 다지기 8"}, {"l": 3, "t": "self", "q": "⁣한 변의 길이가 4인 정삼각형이 평면 α와 60^{°}의 각을 이룰 때, 평면 α 위로의 정사영의 넓이를 구하시오.", "x": null, "s": "⁣**정답: 2√{3}**\n**신호 읽기**: 정사영 넓이 → 원래 넓이부터 구합니다.\n**상황 번역**: 한 변이 4인 정삼각형의 넓이는 {{√{3}§4}} × 4^{2} = 4√{3}\n**풀이**: 4√{3} × cos 60^{°} = 2√{3}\n**함정**: 정삼각형 넓이 공식 {{√{3}§4}}a^{2}을 정확히 씁니다.", "src": "실전 다지기 9"}, {"l": 3, "t": "self", "q": "⁣한 변의 길이가 1인 정육면체 ABCD-EFGH에서 평면 BDE와 평면 ABCD가 이루는 각의 크기를 θ라 할 때, 정사영을 이용하여 cos θ의 값을 구하시오. (단, 점 E는 점 A의 바로 위에 있다.)", "x": null, "s": "⁣**정답: {{√{3}§3}}**\n**신호 읽기**: [고난도] \"정사영을 이용하여 cos θ\" → 원래 도형과 그림자의 넓이를 각각 구해 나눕니다.\n**상황 번역**: 원래 도형은 삼각형 BDE, 바닥 ABCD 위로의 그림자는 E가 A로 내려온 삼각형 BDA입니다.\n**풀이**: 삼각형 BDE는 세 변이 모두 면의 대각선 √{2}인 정삼각형 → 넓이 {{√{3}§4}} × 2 = {{√{3}§2}}. 그림자 ABD 넓이 {{1§2}}. cos θ = {{1/2§√{3}/2}} = {{1§√{3}}} = {{√{3}§3}}\n**함정**: 두 평면이 이루는 각을 직접 그리기 어려울 때 정사영 넓이 비가 가장 빠른 도구입니다. 그림자의 꼭짓점이 어디로 내려가는지 먼저 정합니다.", "src": "실전 다지기 10"}]}, {"id": "sg6", "u": "SG2", "ex": "GE", "t": "3D 건물 주소론", "sm": 1, "en": "Theory of the 3D Address", "th": [["p", "⁣평면 위의 점은 (가로, 세로) 두 숫자로 위치를 알렸습니다. 공간에서는 여기에 '몇 층인가'를 더해 (가로, 세로, 높이) 세 숫자로 주소를 붙입니다. 이것이 **좌표공간**의 점 P(x, y, z)입니다. 마치 아파트 주소를 \"몇 동, 몇 호, 몇 층\"으로 정확히 부르는 것과 같습니다."], ["p", "⁣주소가 세 칸으로 늘었을 뿐, 공통수학2에서 쓰던 도구는 그대로 확장됩니다. 두 점 사이의 거리는 피타고라스 정리를 두 번 쓴 결과이고, 내분점은 각 칸마다 따로 계산합니다. 두 점 A(x_{1}, y_{1}, z_{1}), B(x_{2}, y_{2}, z_{2})를 잇는 선분 AB를 m:n으로 내분하는 점은"], ["p", "⁣({{mx_{2} + nx_{1}§m + n}}, {{my_{2} + ny_{1}§m + n}}, {{mz_{2} + nz_{1}§m + n}})"], ["p", "⁣이고, m = n이면 중점이 됩니다."], ["p", "⁣‾{AB} = √{(x_{2} − x_{1})^{2} + (y_{2} − y_{1})^{2} + (z_{2} − z_{1})^{2}}"], ["p", "⁣**구**는 공간에서 \"한 점(중심)으로부터 거리가 일정한 점들\"입니다. 평면의 원이 공간으로 부풀어 오른 모양이므로, 원의 방정식에 z 한 칸만 더하면 됩니다: (x − a)^{2} + (y − b)^{2} + (z − c)^{2} = r^{2}"], ["li", "⁣**1:1 매칭 기호 독해법**: ==\"==xy==평면 위로의 정사영\"== → z 주소만 0으로. ==\"==x==축 위로의 정사영\"== → x 주소만 남기고 나머지는 0으로. ==\"구가 평면과 만나서 생기는 원\"== → 중심에서 평면까지 거리 d와 반지름 r로 단면 반지름 √{r^{2} − d^{2}}. ==\"지름의 양 끝점\"== → 중심은 두 점의 중점, 반지름은 두 점 사이 거리의 절반."], ["p", "⁣**[보충] 정사영 주소표 (점** (a, b, c)**)**"], ["tbl", [["⁣기준", "⁣정사영", "⁣기억법"], ["⁣xy평면", "⁣(a, b, 0)", "⁣평면에 없는 z만 0"], ["⁣yz평면", "⁣(0, b, c)", "⁣평면에 없는 x만 0"], ["⁣zx평면", "⁣(a, 0, c)", "⁣평면에 없는 y만 0"], ["⁣x축", "⁣(a, 0, 0)", "⁣축 이름 x만 남김"], ["⁣y축", "⁣(0, b, 0)", "⁣축 이름 y만 남김"]]], ["p", "⁣**[보충] 구의 일반형 읽기**: x^{2} + y^{2} + z^{2} + Ax + By + Cz + D = 0 꼴이 나오면 각 문자마다 완전제곱식을 만들어 중심과 반지름을 찾습니다."]], "sum": ["⁣신호: \"좌표공간\", \"구의 방정식\" → **세 칸 거리 공식, 단면 반지름 √{r^{2} − d^{2}}**", "⁣**1:1 매칭 기호 독해법**: ==\"==xy==평면 위로의 정사영\"== → z 주소만 0으로. ==\"==x==축 위로의 정사영\"== → x 주소만 남기고 나머지는 0으로. ==\"구가 평면과 만나서 생기는 원\"== → 중심에서 평면까지 거리 d와 반지름 r로 단면 반지름 √{r^{2} − d^{2}}. ==\"지름의 양 끝점\"== → 중심은 두 점의 중점, 반지름은 두 점 사이 거리의 절반."], "fl": [["⁣\"좌표공간\", \"구의 방정식\" — 이 신호를 보면 꺼낼 도구는?", "⁣세 칸 거리 공식, 단면 반지름 √{r^{2} − d^{2}}"], ["⁣기준: xy평면 → 정사영 / 기억법?", "⁣(a, b, 0) / 평면에 없는 z만 0"], ["⁣기준: yz평면 → 정사영 / 기억법?", "⁣(0, b, c) / 평면에 없는 x만 0"], ["⁣기준: zx평면 → 정사영 / 기억법?", "⁣(a, 0, c) / 평면에 없는 y만 0"], ["⁣기준: x축 → 정사영 / 기억법?", "⁣(a, 0, 0) / 축 이름 x만 남김"]], "bk": {"q": "책을 덮고 「3D 건물 주소론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["⁣신호 문장: \"좌표공간\", \"구의 방정식\"", "⁣꺼낼 도구: 세 칸 거리 공식, 단면 반지름 √{r^{2} − d^{2}}", "⁣1:1 매칭 기호 독해법", "⁣칸별 차이", "⁣거리", "⁣중점"]}, "pr": [{"l": 3, "t": "self", "q": "⁣두 점 A(1, −2, 3), B(3, 2, 7)에 대하여 ==선분== AB==의 길이와 중점의 좌표==를 구하시오.", "x": null, "s": "⁣**1. 칸별 차이** (2, 4, 4)\n**2. 거리** √{4 + 16 + 16} = 6\n**3. 중점** 칸마다 평균 → (2, 0, 5)", "ck": ["⁣칸별 차이", "⁣거리", "⁣중점"], "src": "태원고 기출 기반"}, {"l": 2, "t": "self", "q": "⁣두 점 A(0, 3, −1), B(6, −3, 5)에 대하여 ==선분== AB==를== 1:2==로 내분하는 점==의 좌표를 구하시오.", "x": null, "s": "⁣**1. 내분 공식 장착** ({{1 · x_{2} + 2 · x_{1}§3}}, ⋯), 가까운 점 A에 큰 비중 2\n**2. 칸별 계산** x = {{6 + 0§3}} = 2, y = {{−3 + 6§3}} = 1, z = {{5 − 2§3}} = 1\n**3. 정산** (2, 1, 1)", "ck": ["⁣내분 공식 장착", "⁣칸별 계산", "⁣정산"], "src": "분당 지역 고교 기출 스타일"}, {"l": 2, "t": "self", "q": "⁣구 x^{2} + y^{2} + z^{2} − 2x + 4y − 6z − 2 = 0의 중심의 좌표와 반지름의 길이를 구하시오.", "x": null, "s": "⁣**1. 문자별로 묶기** (x^{2} − 2x) + (y^{2} + 4y) + (z^{2} − 6z) = 2\n**2. 완전제곱식** (x − 1)^{2} + (y + 2)^{2} + (z − 3)^{2} = 2 + 1 + 4 + 9 = 16\n**3. 정산** 중심 (1, −2, 3), 반지름 4", "ck": ["⁣문자별로 묶기", "⁣완전제곱식", "⁣정산"], "src": "교과서 연계"}, {"l": 3, "t": "self", "q": "⁣구 (x − 1)^{2} + (y − 2)^{2} + (z − 3)^{2} = 25가 xy==평면과 만나서 생기는 원==의 넓이를 구하시오.", "x": null, "s": "⁣**1. 중심~평면 거리** 중심 (1, 2, 3)에서 xy평면까지의 거리는 z 주소의 크기인 3\n**2. 단면 반지름** √{25 − 9} = 4\n**3. 정산** π × 4^{2} = 16π", "ck": ["⁣중심~평면 거리", "⁣단면 반지름", "⁣정산"], "src": "태원고 스타일 적중 변형 문제"}, {"l": 1, "t": "sa", "q": "⁣점 (2, −3, 4)의 xy평면 위로의 정사영의 좌표를 구하시오.", "x": "(2, −3, 0)|(2,-3,0)", "s": "⁣**신호 읽기**: \"xy평면 위로의 정사영\" → [보충] 정사영 주소표, 높이 주소 z만 0\n**상황 번역**: 한낮의 햇빛이 위에서 비출 때 점이 바닥에 떨어진 그림자 위치입니다.\n**풀이**: (2, −3, 0)\n**함정**: 평면 이름에 없는 문자(z)가 0이 됩니다.", "src": "실전 다지기 1"}, {"l": 1, "t": "sa", "q": "⁣점 (1, 2, −3)의 yz평면 위로의 정사영의 좌표를 구하시오.", "x": "(0, 2, −3)|(0,2,-3)", "s": "⁣**신호 읽기**: \"yz평면 위로의 정사영\" → 평면 이름에 없는 x만 0\n**상황 번역**: yz평면은 x = 0인 벽입니다. 점에서 벽에 수직으로 내린 발입니다.\n**풀이**: (0, 2, −3)\n**함정**: 1번과 같은 규칙입니다. '없는 문자를 0으로'만 기억하면 여섯 가지 경우를 외울 필요가 없습니다.", "src": "실전 다지기 2"}, {"l": 1, "t": "sa", "q": "⁣원점과 점 (2, 3, 6) 사이의 거리를 구하시오.", "x": "7|7개|7가지", "s": "⁣**신호 읽기**: 원점과의 거리 → 세 칸 거리 공식\n**상황 번역**: 바닥 대각선 √{2^{2} + 3^{2}}을 먼저 구하고, 높이 6과 함께 다시 피타고라스\n**풀이**: √{4 + 9 + 36} = √{49} = 7\n**함정**: 제곱의 합을 먼저 정확히 계산합니다.", "src": "실전 다지기 3"}, {"l": 2, "t": "sa", "q": "⁣두 점 A(1, 2, 0), B(−3, 6, 4)에 대하여 선분 AB의 중점의 좌표를 구하시오.", "x": "(−1, 4, 2)|(-1,4,2)", "s": "⁣**신호 읽기**: 중점 → 칸마다 평균\n**상황 번역**: 내분점 공식에서 m = n = 1인 경우입니다.\n**풀이**: ({{1 − 3§2}}, {{2 + 6§2}}, {{0 + 4§2}}) = (−1, 4, 2)\n**함정**: 세 칸 모두 계산합니다. 공간에서는 z 칸을 빠뜨리기 쉽습니다.", "src": "실전 다지기 4"}, {"l": 2, "t": "sa", "q": "⁣점 (1, 2, 3)이 두 점 A(−3, 6, −1)과 B를 이은 선분의 중점일 때, 점 B의 좌표를 구하시오.", "x": "(5, −2, 7)|(5,-2,7)", "s": "⁣**신호 읽기**: 중점과 한 끝점이 주어짐 → 다른 끝점을 거꾸로 구합니다.\n**상황 번역**: 중점은 A와 B의 한가운데이므로 B = 2 × (중점) − A\n**풀이**: (2 + 3, 4 − 6, 6 + 1) = (5, −2, 7)\n**함정**: 검산: A와 B의 평균이 (1, 2, 3)인지 확인합니다.", "src": "실전 다지기 5"}, {"l": 2, "t": "self", "q": "⁣중심이 (1, −1, 2)이고 반지름의 길이가 3인 구의 방정식을 구하시오.", "x": null, "s": "⁣**정답: (x − 1)^{2} + (y + 1)^{2} + (z − 2)^{2} = 9**\n**신호 읽기**: 중심과 반지름이 주어진 구 → 원의 방정식에 z 한 칸을 더합니다.\n**상황 번역**: 중심에서 거리가 3인 점들 → 거리의 제곱이 9\n**풀이**: (x − 1)^{2} + (y + 1)^{2} + (z − 2)^{2} = 9\n**함정**: 중심의 y좌표 − 1은 식에서 (y + 1)이 됩니다.", "src": "실전 다지기 6"}, {"l": 2, "t": "self", "q": "⁣공간의 두 점 사이의 거리 공식이 피타고라스 정리를 두 번 쓴 결과인 이유를 '바닥 대각선 → 높이' 순서로 서술하시오.", "x": null, "s": "⁣**정답: 바닥에서 가로 차이 a와 세로 차이 b로 바닥 대각선 √{a^{2} + b^{2}}를 구한다(첫 번째 피타고라스). 이 바닥 대각선과 높이 차이 c는 서로 수직이므로, 다시 직각삼각형을 만들어 빗변 √{(a^{2} + b^{2}) + c^{2}} = √{a^{2} + b^{2} + c^{2}}을 구한다(두 번째 피타고라스).**\n**신호 읽기**: 순서를 지정한 서술형 → 두 번의 직각삼각형을 차례로 씁니다.\n**상황 번역**: 직육면체 모양 상자의 대각선 길이를 재는 장면입니다.\n**풀이**: 두 번째 직각삼각형에서 직각이 생기는 이유(높이는 바닥과 수직)까지 쓰면 완성입니다.\n**함정**: 결과 공식만 쓰면 감점입니다. 두 단계를 모두 보입니다.", "src": "실전 다지기 7"}, {"l": 3, "t": "self", "q": "⁣두 점 A(0, −3, −3), B(4, 3, −3)을 지름의 양 끝점으로 하는 구의 중심의 좌표와 반지름의 길이를 구하시오.", "x": null, "s": "⁣**정답: 중심 (2, 0, −3), 반지름 √{13}**\n**신호 읽기**: \"지름의 양 끝점\" → 중심은 중점, 반지름은 거리의 절반\n**상황 번역**: 두 끝점의 한가운데가 구의 중심입니다.\n**풀이**: 중심 ({{0 + 4§2}}, {{−3 + 3§2}}, {{−3 − 3§2}}) = (2, 0, −3). 지름 √{16 + 36 + 0} = 2√{13} → 반지름 √{13}\n**함정**: 지름을 반지름으로 착각하지 않습니다.", "src": "실전 다지기 8"}, {"l": 3, "t": "self", "q": "⁣중심이 (2, 2, 0)이고 점 (3, 4, 2)를 지나는 구의 방정식을 구하시오.", "x": null, "s": "⁣**정답: (x − 2)^{2} + (y − 2)^{2} + z^{2} = 9**\n**신호 읽기**: 중심과 지나는 점 → 둘 사이 거리가 반지름\n**상황 번역**: r^{2}을 바로 구하면 제곱근 계산이 필요 없습니다.\n**풀이**: r^{2} = (3 − 2)^{2} + (4 − 2)^{2} + (2 − 0)^{2} = 1 + 4 + 4 = 9\n**함정**: 중심의 z좌표가 0이면 식에서 z^{2}으로 씁니다.", "src": "실전 다지기 9"}, {"l": 3, "t": "self", "q": "⁣구 x^{2} + y^{2} + z^{2} − 4x + 2y − 6z − 11 = 0이 yz평면과 만나서 생기는 원의 넓이를 구하시오.", "x": null, "s": "⁣**정답: 21π**\n**신호 읽기**: [고난도] 일반형 구 + \"평면과 만나서 생기는 원\" → 완전제곱식으로 중심과 반지름을 찾고, 단면 반지름 √{r^{2} − d^{2}}를 씁니다.\n**상황 번역**: 구를 벽(yz평면, x = 0)으로 자른 단면입니다. 중심에서 벽까지 거리 d는 중심의 x 주소 크기입니다.\n**풀이**: (x − 2)^{2} + (y + 1)^{2} + (z − 3)^{2} = 25 → 중심 (2, −1, 3), r = 5, d = 2. 단면 반지름 √{25 − 4} = √{21} → 넓이 21π\n**함정**: 단면 반지름은 피타고라스(반지름이 빗변)로 구합니다. r − d = 3으로 빼면 틀립니다.", "src": "실전 다지기 10"}]}, {"id": "sg7", "u": "SG3", "ex": "GE", "t": "화살표 택배론", "sm": 1, "en": "Theory of the Arrow Delivery", "th": [["p", "⁣택배 기사에게 \"3 km 가세요\"라고만 하면 물건이 도착할 수 없습니다. \"북동쪽으로 3 km\"처럼 **방향과 크기**를 함께 알려 주어야 하지요. 이렇게 크기와 방향을 함께 가진 양이 **벡터**이고, 화살표로 그립니다. 화살표는 출발점이 달라도 길이와 방향이 같으면 같은 벡터입니다."], ["p", "⁣벡터의 덧셈은 '택배 이어 보내기'입니다. ⇀{a}만큼 간 뒤 이어서 ⇀{b}만큼 가면, 처음부터 ⇀{a} + ⇀{b}만큼 간 것과 같습니다. 성분으로 쓰면 칸마다 더하면 됩니다. 원점 O에서 점 A로 가는 화살표 ⇀{OA}를 점 A의 **위치벡터**라 합니다. 위치벡터는 택배의 도착 주소이므로, 두 점 사이 화살표는 ⇀{AB} = ⇀{OB} − ⇀{OA}(도착 주소 − 출발 주소)이고, 선분 AB를 m:n으로 내분하는 점의 위치벡터는 유형 6의 내분점처럼 {{m⇀{b} + n⇀{a}§m + n}}입니다."], ["p", "⁣**내적** ⇀{a} · ⇀{b} = | ⇀{a} || ⇀{b} |cos θ는 \"한 화살표가 다른 화살표 방향으로 실제로 얼마나 일했는가\"를 재는 도구입니다. ⇀{b}의 그림자(정사영)를 ⇀{a} 위에 드리운 길이에 | ⇀{a} |를 곱한 것이지요. 그래서 두 화살표가 **수직이면 그림자가 0이 되어 내적이 0**입니다. 성분으로는 ⇀{a} · ⇀{b} = a_{1}b_{1} + a_{2}b_{2}(+ a_{3}b_{3})입니다."], ["li", "⁣**1:1 매칭 기호 독해법**: ==\"수직\"== → ⇀{a} · ⇀{b} = 0. ==\"평행\"== → ⇀{b} = k⇀{a} (k ≠ 0인 실수, 영벡터가 아닌 두 벡터의 성분의 비가 같다). ==\"==| ⇀{a} + ⇀{b} |==\"== → 제곱하여 | ⇀{a} |^{2} + 2⇀{a} · ⇀{b} + | ⇀{b} |^{2}. ==\"==m:n==으로 내분하는 점의 위치벡터\"== → {{m⇀{b} + n⇀{a}§m + n}}."], ["p", "⁣**[보충] 벡터 도구표**"], ["tbl", [["⁣문장", "⁣번역", "⁣식"], ["⁣벡터의 크기", "⁣화살표 길이", "⁣√{a_{1}^{2} + a_{2}^{2} + a_{3}^{2}}"], ["⁣두 벡터가 이루는 각", "⁣내적 거꾸로", "⁣cos θ = {{⇀{a} · ⇀{b}§| ⇀{a} || ⇀{b} |}}"], ["⁣수직", "⁣그림자 0", "⁣⇀{a} · ⇀{b} = 0"], ["⁣평행", "⁣같은 방향 또는 반대 방향", "⁣⇀{b} = k⇀{a} (k ≠ 0)"], ["⁣두 점 A, B를 잇는 벡터", "⁣도착 주소 − 출발 주소", "⁣⇀{AB} = ⇀{b} − ⇀{a}"]]], ["p", "⁣**[보충] 내적의 최대·최소**: ⇀{a} · ⇀{b} = | ⇀{a} || ⇀{b} |cos θ에서 cos θ는 − 1에서 1 사이이므로, 두 벡터가 같은 방향일 때 최대 | ⇀{a} || ⇀{b} |, 반대 방향일 때 최소 −| ⇀{a} || ⇀{b} |입니다."]], "sum": ["⁣신호: \"수직\", \"평행\", \"내적\" → **⇀{a} · ⇀{b} = 0, | ⇀{a} + ⇀{b} |^{2} 전개**", "⁣**1:1 매칭 기호 독해법**: ==\"수직\"== → ⇀{a} · ⇀{b} = 0. ==\"평행\"== → ⇀{b} = k⇀{a} (k ≠ 0인 실수, 영벡터가 아닌 두 벡터의 성분의 비가 같다). ==\"==| ⇀{a} + ⇀{b} |==\"== → 제곱하여 | ⇀{a} |^{2} + 2⇀{a} · ⇀{b} + | ⇀{b} |^{2}. ==\"==m:n==으로 내분하는 점의 위치벡터\"== → {{m⇀{b} + n⇀{a}§m + n}}."], "fl": [["⁣\"수직\", \"평행\", \"내적\" — 이 신호를 보면 꺼낼 도구는?", "⁣⇀{a} · ⇀{b} = 0, | ⇀{a} + ⇀{b} |^{2} 전개"], ["⁣문장: 벡터의 크기 → 번역 / 식?", "⁣화살표 길이 / √{a_{1}^{2} + a_{2}^{2} + a_{3}^{2}}"], ["⁣문장: 두 벡터가 이루는 각 → 번역 / 식?", "⁣내적 거꾸로 / cos θ = {{⇀{a} · ⇀{b}§| ⇀{a} || ⇀{b} |}}"], ["⁣문장: 수직 → 번역 / 식?", "⁣그림자 0 / ⇀{a} · ⇀{b} = 0"], ["⁣문장: 평행 → 번역 / 식?", "⁣같은 방향 또는 반대 방향 / ⇀{b} = k⇀{a} (k ≠ 0)"]], "bk": {"q": "책을 덮고 「화살표 택배론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["⁣신호 문장: \"수직\", \"평행\", \"내적\"", "⁣꺼낼 도구: ⇀{a} · ⇀{b} = 0, | ⇀{a} + ⇀{b} |^{2} 전개", "⁣1:1 매칭 기호 독해법", "⁣실수배", "⁣이어 보내기 (칸별 덧셈)", "⁣정산"]}, "pr": [{"l": 3, "t": "self", "q": "⁣두 벡터 ⇀{a} = (2, 3), ⇀{b} = (−1, 2)에 대하여 ==벡터== ⇀{a} + 2⇀{b}==의 성분과 크기==를 구하시오.", "x": null, "s": "⁣**1. 실수배** 2⇀{b} = (−2, 4)\n**2. 이어 보내기 (칸별 덧셈)** ⇀{a} + 2⇀{b} = (0, 7)\n**3. 정산** | ⇀{a} + 2⇀{b} | = √{0 + 49} = 7", "ck": ["⁣실수배", "⁣이어 보내기 (칸별 덧셈)", "⁣정산"], "src": "태원고 기출 기반"}, {"l": 2, "t": "self", "q": "⁣두 벡터 ⇀{a}, ⇀{b}에 대하여 | ⇀{a} | = 2, | ⇀{b} | = 3, ⇀{a} · ⇀{b} = 3일 때, | ⇀{a} + ⇀{b} |의 값을 구하시오.", "x": null, "s": "⁣**1. 제곱 신호** 크기 기호가 나오면 제곱해서 내적으로 풉니다.\n**2. 전개** | ⇀{a} + ⇀{b} |^{2} = | ⇀{a} |^{2} + 2⇀{a} · ⇀{b} + | ⇀{b} |^{2} = 4 + 6 + 9 = 19\n**3. 정산** √{19}", "ck": ["⁣제곱 신호", "⁣전개", "⁣정산"], "src": "분당 지역 고교 기출 스타일"}, {"l": 2, "t": "self", "q": "⁣두 벡터 ⇀{a} = (2, k, 1), ⇀{b} = (1, −2, 2)가 ==서로 수직==일 때, 상수 k의 값을 구하시오.", "x": null, "s": "⁣**1. 수직 번역** ⇀{a} · ⇀{b} = 0\n**2. 성분 내적** 2 − 2k + 2 = 0\n**3. 정산** k = 2", "ck": ["⁣수직 번역", "⁣성분 내적", "⁣정산"], "src": "교과서 연계"}, {"l": 3, "t": "self", "q": "⁣두 벡터 ⇀{a}, ⇀{b}에 대하여 | ⇀{a} | = 2, | ⇀{b} | = 1이고 두 벡터가 이루는 각의 크기가 60^{°}일 때, | 2⇀{a} − 3⇀{b} |의 값을 구하시오.", "x": null, "s": "⁣**1. 내적 먼저 구하기** ⇀{a} · ⇀{b} = 2 × 1 × cos 60^{°} = 1\n**2. 제곱 신호** | 2⇀{a} − 3⇀{b} |^{2} = 4| ⇀{a} |^{2} − 12⇀{a} · ⇀{b} + 9| ⇀{b} |^{2} = 16 − 12 + 9 = 13\n**3. 정산** √{13}", "ck": ["⁣내적 먼저 구하기", "⁣제곱 신호", "⁣정산"], "src": "태원고 스타일 적중 변형 문제"}, {"l": 1, "t": "sa", "q": "⁣벡터 ⇀{a} = (3, 4)의 크기를 구하시오.", "x": "5|5개|5가지", "s": "⁣**신호 읽기**: \"벡터의 크기\" → 화살표의 길이 → 성분을 두 변으로 하는 직각삼각형의 빗변입니다.\n**상황 번역**: 오른쪽으로 3, 위로 4 가는 택배 화살표\n**풀이**: √{3^{2} + 4^{2}} = 5\n**함정**: 크기는 항상 0 이상입니다. 성분에 음수가 있어도 제곱하면 양수가 됩니다.", "src": "실전 다지기 1"}, {"l": 1, "t": "sa", "q": "⁣두 벡터 ⇀{a} = (1, 3), ⇀{b} = (3, 1)에 대하여 2⇀{a} − ⇀{b}를 성분으로 나타내시오.", "x": "(−1, 5)|(-1,5)", "s": "⁣**신호 읽기**: 실수배와 뺄셈 → 칸마다 계산합니다.\n**상황 번역**: 2⇀{a}는 같은 방향으로 두 배 멀리, −⇀{b}는 ⇀{b}를 반대로 돌린 화살표입니다. 둘을 이어 보냅니다.\n**풀이**: 2⇀{a} = (2, 6) → (2 − 3, 6 − 1) = (−1, 5)\n**함정**: 실수배는 모든 성분에 곱합니다. 첫 성분에만 곱하는 실수를 조심합니다.", "src": "실전 다지기 2"}, {"l": 1, "t": "sa", "q": "⁣두 벡터 ⇀{a} = (1, 2, −1), ⇀{b} = (2, −1, 1)의 내적을 구하시오.", "x": "− 1|-1|-1개|-1가지", "s": "⁣**신호 읽기**: 성분으로 주어진 내적 → 같은 칸끼리 곱해 모두 더합니다.\n**상황 번역**: 공간벡터이므로 칸이 세 개입니다.\n**풀이**: 1 × 2 + 2 × (−1) + (−1) × 1 = 2 − 2 − 1 = −1\n**함정**: 내적의 결과는 벡터가 아니라 하나의 수입니다. 음수이면 두 화살표가 이루는 각이 90^{°}보다 큽니다.", "src": "실전 다지기 3"}, {"l": 2, "t": "self", "q": "⁣두 벡터 ⇀{a} = (1, 0), ⇀{b} = (1, √{3})이 이루는 각의 크기를 구하시오.", "x": null, "s": "⁣**정답: 60^{°}**\n**신호 읽기**: \"이루는 각\" → 내적 공식을 거꾸로 씁니다. cos θ = {{⇀{a} · ⇀{b}§| ⇀{a} || ⇀{b} |}}\n**상황 번역**: 성분 내적과 크기를 각각 구해 넣습니다.\n**풀이**: ⇀{a} · ⇀{b} = 1, | ⇀{a} | = 1, | ⇀{b} | = √{1 + 3} = 2 → cos θ = {{1§2}} → θ = 60^{°}\n**함정**: 두 벡터가 이루는 각은 0^{°}부터 180^{°} 사이에서 찾습니다.", "src": "실전 다지기 4"}, {"l": 2, "t": "sa", "q": "⁣두 벡터 ⇀{a} = (2, 4), ⇀{b} = (k − 2, 6)이 서로 평행할 때, 상수 k의 값을 구하시오.", "x": "k = 5|k=5|5", "s": "⁣**신호 읽기**: \"평행\" → ⇀{b} = k⇀{a}, 즉 성분의 비가 같습니다.\n**상황 번역**: 같은 방향(또는 반대 방향)으로 뻗은 화살표는 길이만 다르고 성분의 비율이 같습니다.\n**풀이**: {{k − 2§2}} = {{6§4}} → k − 2 = 3 → k = 5\n**함정**: 이 문제의 상수 k와 평행 조건의 실수배 k는 다른 문자입니다. 헷갈리면 실수배를 t로 바꿔 씁니다.", "src": "실전 다지기 5"}, {"l": 2, "t": "sa", "q": "⁣| ⇀{a} | = 1, | ⇀{b} | = 2, | ⇀{a} − ⇀{b} | = √{3}일 때, ⇀{a} · ⇀{b}의 값을 구하시오.", "x": "1|1개|1가지", "s": "⁣**신호 읽기**: 크기 기호 | ⇀{a} − ⇀{b} | → 제곱하여 내적으로 풀라는 신호입니다.\n**상황 번역**: | ⇀{a} − ⇀{b} |^{2} = | ⇀{a} |^{2} − 2⇀{a} · ⇀{b} + | ⇀{b} |^{2}\n**풀이**: 3 = 1 − 2⇀{a} · ⇀{b} + 4 → 2⇀{a} · ⇀{b} = 2 → ⇀{a} · ⇀{b} = 1\n**함정**: 크기를 그대로 빼서 | ⇀{a} | − | ⇀{b} |로 계산하면 틀립니다. 화살표의 길이는 성분처럼 더하고 뺄 수 없습니다.", "src": "실전 다지기 6"}, {"l": 2, "t": "self", "q": "⁣서로 수직인 두 벡터의 내적이 0인 이유를 '그림자(정사영)' 비유로 서술하시오.", "x": null, "s": "⁣**정답: 내적은 한 벡터의 그림자(정사영)를 다른 벡터 위에 드리운 길이에 그 벡터의 크기를 곱한 값이다. 두 벡터가 수직이면 한 화살표를 다른 화살표 위에 비추었을 때 그림자가 한 점으로 줄어 길이가 0이 되므로 내적도 0이다.**\n**신호 읽기**: 비유를 지정한 서술형 → 내적의 뜻(그림자 × 크기)을 먼저 쓰고, 수직일 때 그림자가 어떻게 되는지 씁니다.\n**상황 번역**: 한낮의 막대 그림자(유형 5)처럼, 막대가 땅에 수직이면 그림자가 점이 됩니다.\n**풀이**: 식 ⇀{a} · ⇀{b} = | ⇀{a} || ⇀{b} |cos 90^{°} = 0을 함께 쓰면 완성입니다.\n**함정**: \"수직이니까 0\"은 결론의 반복입니다. 그림자가 사라지는 과정을 씁니다.", "src": "실전 다지기 7"}, {"l": 3, "t": "self", "q": "⁣두 점 A(1, 2), B(7, 5)에 대하여 선분 AB를 1:2로 내분하는 점 P의 위치벡터 ⇀{OP}를 성분으로 나타내시오.", "x": null, "s": "⁣**정답: ⇀{OP} = (3, 3)**\n**신호 읽기**: \"내분하는 점의 위치벡터\" → {{m⇀{b} + n⇀{a}§m + n}} (가까운 점에 큰 비중)\n**상황 번역**: 1:2이면 A에 더 가까우므로 ⇀{a}에 비중 2, ⇀{b}에 비중 1\n**풀이**: {{1 × (7, 5) + 2 × (1, 2)§3}} = {{(9, 9)§3}} = (3, 3)\n**함정**: 위치벡터의 성분은 그 점의 좌표와 같습니다. 공통수학2의 내분점 공식과 같은 결과인지 확인합니다.", "src": "실전 다지기 8"}, {"l": 3, "t": "self", "q": "⁣두 점 A(1, 0, 2), B(3, −1, 4)에 대하여 벡터 ⇀{AB}의 성분과 크기를 구하시오.", "x": null, "s": "⁣**정답: ⇀{AB} = (2, −1, 2), 크기 3**\n**신호 읽기**: 두 점을 잇는 벡터 → 도착 주소 − 출발 주소\n**상황 번역**: A에서 출발해 B에 도착하는 택배 화살표\n**풀이**: (3 − 1, −1 − 0, 4 − 2) = (2, −1, 2). 크기 √{4 + 1 + 4} = 3\n**함정**: ⇀{AB}는 B − A입니다. A − B로 쓰면 방향이 반대인 화살표가 됩니다.", "src": "실전 다지기 9"}, {"l": 3, "t": "sa", "q": "⁣원점 O와 점 A(√{5}, 2)에 대하여 점 P가 원 x^{2} + y^{2} = 4 위를 움직일 때, ⇀{OA} · ⇀{OP}의 최댓값을 구하시오.", "x": "6|6개|6가지", "s": "⁣**신호 읽기**: [고난도] 내적의 최댓값 → [보충] 내적의 최대·최소. 두 화살표의 길이는 고정이고 각만 변합니다.\n**상황 번역**: | ⇀{OA} | = √{5 + 4} = 3, | ⇀{OP} | = 2(원의 반지름). 내적 = 3 × 2 × cos θ = 6cos θ\n**풀이**: cos θ의 최댓값은 1(두 화살표가 같은 방향) → 최댓값 6\n**함정**: 점 P가 원 위를 움직이므로 ⇀{OP}의 길이는 항상 2입니다. 같은 방향이 되는 점 P가 실제로 원 위에 있으므로 최댓값이 됩니다.", "src": "실전 다지기 10"}]}, {"id": "sg8", "u": "SG3", "ex": "GE", "t": "레일과 깃대론", "sm": 1, "en": "Theory of the Rail and the Flagpole", "th": [["p", "⁣직선은 끝없이 뻗은 **기차 레일**입니다. 레일을 설계하려면 두 가지만 있으면 됩니다. 레일이 지나는 **한 지점** A와, 레일이 뻗어 나가는 **방향 화살표**(방향벡터) ⇀{u}입니다. 기차가 A에서 출발해 ⇀{u} 방향으로 t배만큼 달리면 레일 위의 어느 곳에든 갈 수 있으므로, 레일 위의 점 P의 위치벡터는"], ["p", "⁣⇀{p} = ⇀{a} + t⇀{u} (t는 실수)"], ["p", "⁣입니다. 이것을 성분으로 풀어 쓰고 t를 없애면 {{x − x_{1}§u_{1}}} = {{y − y_{1}§u_{2}}} = {{z − z_{1}§u_{3}}}이 됩니다. 두 점 A, B를 지나는 직선은 ⇀{AB}를 방향 화살표로 쓰면 됩니다."], ["p", "⁣평면은 운동장 바닥입니다. 바닥에 **수직으로 꽂힌 깃대**(법선벡터) ⇀{n}을 하나 세우면, 바닥 위의 어떤 화살표 ⇀{AP}도 깃대와 수직입니다. 수직이면 내적이 0(유형 7)이므로 평면 위의 점 P는"], ["p", "⁣⇀{n} · (⇀{p} − ⇀{a}) = 0 ⇒ n_{1}(x − x_{1}) + n_{2}(y − y_{1}) + n_{3}(z − z_{1}) = 0"], ["p", "⁣을 만족합니다. 거꾸로, 평면의 방정식 ax + by + cz + d = 0을 보면 x, y, z의 계수 (a, b, c)가 바로 깃대(법선벡터)입니다. 구도 같은 생각으로, 중심 C에서 거리가 r인 점들이므로 | ⇀{p} − ⇀{c} | = r로 쓸 수 있습니다(유형 6의 구의 방정식)."], ["li", "⁣**1:1 매칭 기호 독해법**: ==\"점== A==를 지나고 방향벡터가== ⇀{u}==인 직선\"== → {{x − x_{1}§u_{1}}} = {{y − y_{1}§u_{2}}} = {{z − z_{1}§u_{3}}}. ==\"두 점을 지나는 직선\"== → ⇀{AB}를 방향벡터로. ==\"법선벡터가== ⇀{n}==인 평면\"== → n_{1}(x − x_{1}) + n_{2}(y − y_{1}) + n_{3}(z − z_{1}) = 0. ==\"직선과 평면이 만나는 점\"== → 직선을 t로 쓰고 평면에 대입. ==\"두 직선(두 평면)이 이루는 각\"== → 방향벡터(법선벡터)끼리의 각."], ["p", "⁣**[보충] 레일과 깃대 정리표**"], ["tbl", [["⁣대상", "⁣필요한 것", "⁣식"], ["⁣직선", "⁣한 점 + 방향벡터 ⇀{u}", "⁣⇀{p} = ⇀{a} + t⇀{u}"], ["⁣평면", "⁣한 점 + 법선벡터 ⇀{n}", "⁣⇀{n} · (⇀{p} − ⇀{a}) = 0"], ["⁣구", "⁣중심 + 반지름", "⁣| ⇀{p} − ⇀{c} | = r"], ["⁣두 직선이 이루는 각", "⁣방향벡터 사이의 각", "⁣cos θ = {{| ⇀{u} · ⇀{v} |§| ⇀{u} || ⇀{v} |}}"], ["⁣직선 ⊥ 평면", "⁣방향벡터 ∥ 법선벡터", "⁣⇀{u} = k⇀{n}"]]], ["p", "⁣**[보충] 방향벡터의 성분이 0일 때**: 방향벡터가 (1, 2, 0)처럼 0인 성분이 있으면 분모에 0을 쓸 수 없으므로, 그 좌표는 z = z_{1}처럼 따로 씁니다. 그 방향으로는 레일이 움직이지 않는다는 뜻입니다."]], "sum": ["⁣신호: \"방향벡터\", \"법선벡터\", \"만나는 점\" → **⇀{p} = ⇀{a} + t⇀{u}, ⇀{n} · (⇀{p} − ⇀{a}) = 0**", "⁣**1:1 매칭 기호 독해법**: ==\"점== A==를 지나고 방향벡터가== ⇀{u}==인 직선\"== → {{x − x_{1}§u_{1}}} = {{y − y_{1}§u_{2}}} = {{z − z_{1}§u_{3}}}. ==\"두 점을 지나는 직선\"== → ⇀{AB}를 방향벡터로. ==\"법선벡터가== ⇀{n}==인 평면\"== → n_{1}(x − x_{1}) + n_{2}(y − y_{1}) + n_{3}(z − z_{1}) = 0. ==\"직선과 평면이 만나는 점\"== → 직선을 t로 쓰고 평면에 대입. ==\"두 직선(두 평면)이 이루는 각\"== → 방향벡터(법선벡터)끼리의 각."], "fl": [["⁣\"방향벡터\", \"법선벡터\", \"만나는 점\" — 이 신호를 보면 꺼낼 도구는?", "⁣⇀{p} = ⇀{a} + t⇀{u}, ⇀{n} · (⇀{p} − ⇀{a}) = 0"], ["⁣대상: 직선 → 필요한 것 / 식?", "⁣한 점 + 방향벡터 ⇀{u} / ⇀{p} = ⇀{a} + t⇀{u}"], ["⁣대상: 평면 → 필요한 것 / 식?", "⁣한 점 + 법선벡터 ⇀{n} / ⇀{n} · (⇀{p} − ⇀{a}) = 0"], ["⁣대상: 구 → 필요한 것 / 식?", "⁣중심 + 반지름 / | ⇀{p} − ⇀{c} | = r"], ["⁣대상: 두 직선이 이루는 각 → 필요한 것 / 식?", "⁣방향벡터 사이의 각 / cos θ = {{| ⇀{u} · ⇀{v} |§| ⇀{u} || ⇀{v} |}}"]], "bk": {"q": "책을 덮고 「레일과 깃대론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["⁣신호 문장: \"방향벡터\", \"법선벡터\", \"만나는 점\"", "⁣꺼낼 도구: ⇀{p} = ⇀{a} + t⇀{u}, ⇀{n} · (⇀{p} − ⇀{a}) = 0", "⁣1:1 매칭 기호 독해법", "⁣레일 설계도", "⁣t 없애기", "⁣정산"]}, "pr": [{"l": 3, "t": "self", "q": "⁣점 (1, 2)를 지나고 ==방향벡터가== ⇀{u} = (3, −1)==인 직선==의 방정식을 구하시오.", "x": null, "s": "⁣**1. 레일 설계도** (x, y) = (1 + 3t, 2 − t)\n**2. t 없애기** t = {{x − 1§3}} = {{y − 2§−1}}\n**3. 정산** {{x − 1§3}} = {{y − 2§−1}} (정리하면 x + 3y − 7 = 0)", "ck": ["⁣레일 설계도", "⁣t 없애기", "⁣정산"], "src": "태원고 기출 기반"}, {"l": 2, "t": "self", "q": "⁣==두 점== A(1, 0, 2)==,== B(3, 1, 0)==을 지나는 직선==의 방정식을 구하시오.", "x": null, "s": "⁣**1. 방향 화살표 만들기** ⇀{AB} = (3 − 1, 1 − 0, 0 − 2) = (2, 1, −2)\n**2. 레일 설계도** 점 A를 지나고 방향벡터 (2, 1, −2)\n**3. 정산** {{x − 1§2}} = {{y§1}} = {{z − 2§−2}}", "ck": ["⁣방향 화살표 만들기", "⁣레일 설계도", "⁣정산"], "src": "분당 지역 고교 기출 스타일"}, {"l": 2, "t": "self", "q": "⁣점 (1, −1, 2)를 지나고 ==법선벡터가== ⇀{n} = (2, 1, −2)==인 평면==의 방정식을 구하시오.", "x": null, "s": "⁣**1. 깃대와 수직** 평면 위의 점 P(x, y, z)에 대하여 ⇀{n} · ⇀{AP} = 0\n**2. 성분 내적** 2(x − 1) + 1(y + 1) − 2(z − 2) = 0\n**3. 정산** 2x + y − 2z + 3 = 0", "ck": ["⁣깃대와 수직", "⁣성분 내적", "⁣정산"], "src": "교과서 연계"}, {"l": 3, "t": "self", "q": "⁣점 A(1, 2, 3)을 지나고 ==방향벡터가== ⇀{u} = (2, −1, 1)==인 직선==이 xy평면과 만나는 점의 좌표를 구하시오.", "x": null, "s": "⁣**1. 직선의 택배 경로** (x, y, z) = (1 + 2t, 2 − t, 3 + t)\n**2. xy평면 도착 조건** z = 3 + t = 0 → t = −3\n**3. 정산** (1 − 6, 2 + 3, 0) = (−5, 5, 0)", "ck": ["⁣직선의 택배 경로", "⁣xy평면 도착 조건", "⁣정산"], "src": "태원고 스타일 적중 변형 문제"}, {"l": 1, "t": "self", "q": "⁣점 (2, 1)을 지나고 방향벡터가 ⇀{u} = (3, 4)인 직선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: {{x − 2§3}} = {{y − 1§4}}**\n**신호 읽기**: \"점을 지나고 방향벡터가 ~인 직선\" → 레일 설계도(한 점 + 방향 화살표)\n**상황 번역**: (x, y) = (2 + 3t, 1 + 4t)에서 t를 없앱니다.\n**풀이**: t = {{x − 2§3}} = {{y − 1§4}} → {{x − 2§3}} = {{y − 1§4}} (정리하면 4x − 3y − 5 = 0)\n**함정**: 분모에는 방향벡터의 성분, 분자에는 지나는 점의 좌표가 들어갑니다. 자리를 바꾸지 않습니다.", "src": "실전 다지기 1"}, {"l": 1, "t": "sa", "q": "⁣점 (0, 1, −1)을 지나고 방향벡터가 ⇀{u} = (1, 2, 2)인 직선 위의 점을 매개변수 t를 이용하여 나타내시오.", "x": "(t, 1 + 2t, −1 + 2t)|(t,1+2t,-1+2t)", "s": "⁣**신호 읽기**: \"매개변수 t를 이용하여\" → ⇀{p} = ⇀{a} + t⇀{u}를 성분으로 씁니다.\n**상황 번역**: 출발점 (0, 1, −1)에서 방향 (1, 2, 2)로 t배 달린 위치\n**풀이**: (0 + t, 1 + 2t, −1 + 2t)\n**함정**: t에 여러 값을 넣어 보면 레일 위의 점들이 나옵니다. t = 0이면 출발점입니다.", "src": "실전 다지기 2"}, {"l": 1, "t": "self", "q": "⁣두 점 (1, 1, 1), (2, 3, 5)를 지나는 직선의 방정식을 구하시오.", "x": null, "s": "⁣**정답: x − 1 = {{y − 1§2}} = {{z − 1§4}}**\n**신호 읽기**: \"두 점을 지나는 직선\" → 두 점을 잇는 벡터를 방향 화살표로 씁니다.\n**상황 번역**: 방향벡터 (2 − 1, 3 − 1, 5 − 1) = (1, 2, 4), 지나는 점 (1, 1, 1)\n**풀이**: {{x − 1§1}} = {{y − 1§2}} = {{z − 1§4}}\n**함정**: 분모가 1이면 생략해 x − 1로 씁니다.", "src": "실전 다지기 3"}, {"l": 2, "t": "sa", "q": "⁣점 (1, 2, 3)을 지나고 법선벡터가 (1, 1, 1)인 평면의 방정식을 구하시오.", "x": "x + y + z = 6|x+y+z=6", "s": "⁣**신호 읽기**: \"법선벡터가 ~인 평면\" → 깃대와 수직인 바닥\n**상황 번역**: 평면 위의 화살표 ⇀{AP}와 깃대 (1, 1, 1)의 내적이 0\n**풀이**: (x − 1) + (y − 2) + (z − 3) = 0 → x + y + z = 6\n**함정**: 결과의 계수 (1, 1, 1)이 법선벡터와 같은지 확인하면 검산이 됩니다.", "src": "실전 다지기 4"}, {"l": 2, "t": "self", "q": "⁣방향벡터가 각각 (1, 1, 0), (0, 1, 1)인 두 직선이 이루는 각의 크기를 구하시오.", "x": null, "s": "⁣**정답: 60^{°}**\n**신호 읽기**: \"두 직선이 이루는 각\" → 방향 화살표끼리 이루는 각을 내적으로 구합니다.\n**상황 번역**: cos θ = {{| ⇀{u} · ⇀{v} |§| ⇀{u} || ⇀{v} |}}\n**풀이**: ⇀{u} · ⇀{v} = 0 + 1 + 0 = 1, | ⇀{u} | = | ⇀{v} | = √{2} → cos θ = {{1§2}} → 60^{°}\n**함정**: 두 직선이 이루는 각은 90^{°} 이하로 정하므로 내적에 절댓값을 씌웁니다.", "src": "실전 다지기 5"}, {"l": 2, "t": "sa", "q": "⁣직선 {{x − 1§2}} = {{y + 1§k}} = {{z§3}}이 평면 2x + 4y + 3z = 5에 수직일 때, 상수 k의 값을 구하시오.", "x": "k = 4|k=4|4", "s": "⁣**신호 읽기**: \"직선이 평면에 수직\" → 레일이 깃대와 같은 방향 → 방향벡터 ∥ 법선벡터\n**상황 번역**: 방향벡터 (2, k, 3), 법선벡터 (2, 4, 3)의 성분의 비가 같아야 합니다.\n**풀이**: {{2§2}} = {{k§4}} = {{3§3}} → k = 4\n**함정**: '평면에 수직'을 '법선벡터에 수직'으로 바꾸어 내적 0을 쓰면 반대 조건(평면에 평행)이 됩니다.", "src": "실전 다지기 6"}, {"l": 2, "t": "self", "q": "⁣평면의 방정식이 한 점과 법선벡터만으로 정해지는 이유를 '운동장 바닥과 깃대' 비유로 서술하시오.", "x": null, "s": "⁣**정답: 평면은 운동장 바닥이고 법선벡터는 바닥에 수직으로 꽂힌 깃대이다. 바닥 위의 한 점 A를 정하면, 바닥 위의 다른 점 P로 가는 화살표 ⇀{AP}는 모두 바닥에 누워 있으므로 깃대와 수직이다. 거꾸로 깃대와 수직인 화살표로 갈 수 있는 점은 모두 그 바닥 위에 있으므로, 한 점과 깃대 방향만 알면 바닥(평면)이 하나로 정해진다.**\n**신호 읽기**: 비유를 지정한 서술형 → '평면 위의 화살표는 모두 깃대와 수직'이 핵심 문장입니다.\n**상황 번역**: 같은 깃대 방향이라도 꽂는 위치(한 점)가 다르면 높이가 다른 평행한 바닥이 됩니다. 그래서 한 점도 필요합니다.\n**풀이**: 수직 → 내적 0 → ⇀{n} · (⇀{p} − ⇀{a}) = 0으로 이어지는 흐름까지 쓰면 완성입니다.\n**함정**: 깃대만 있으면 평면이 하나로 정해지지 않는다는 점(한 점이 왜 필요한지)도 함께 씁니다.", "src": "실전 다지기 7"}, {"l": 3, "t": "sa", "q": "⁣평면 x + 2y − 2z = 4가 x축과 만나는 점의 좌표를 구하시오.", "x": "(4, 0, 0)|(4,0,0)", "s": "⁣**신호 읽기**: \"x축과 만나는 점\" → x축 위의 점은 y = 0, z = 0\n**상황 번역**: 평면의 방정식에 y = z = 0을 넣습니다.\n**풀이**: x = 4 → (4, 0, 0)\n**함정**: 이 값을 평면의 'x절편'이라 합니다. y절편(y = 2), z절편(z = −2)도 같은 방법으로 구합니다.", "src": "실전 다지기 8"}, {"l": 3, "t": "sa", "q": "⁣직선 x − 1 = {{y − 2§2}} = {{z − 3§−1}}과 평면 x + y + z = 12가 만나는 점의 좌표를 구하시오.", "x": "(4, 8, 0)|(4,8,0)", "s": "⁣**신호 읽기**: \"직선과 평면이 만나는 점\" → 레일을 t로 쓰고 평면 식에 대입합니다.\n**상황 번역**: 비례식의 공통값을 t로 두면 x = 1 + t, y = 2 + 2t, z = 3 − t\n**풀이**: (1 + t) + (2 + 2t) + (3 − t) = 12 → 6 + 2t = 12 → t = 3 → (4, 8, 0)\n**함정**: t를 구한 뒤 좌표로 되돌리는 단계를 빠뜨리지 않습니다. 구한 점이 평면 식을 만족하는지(4 + 8 + 0 = 12) 확인합니다.", "src": "실전 다지기 9"}, {"l": 3, "t": "self", "q": "⁣두 평면 x + y = 1, y + z = 2가 이루는 각의 크기를 법선벡터를 이용하여 구하시오.", "x": null, "s": "⁣**정답: 60^{°}**\n**신호 읽기**: [고난도] \"두 평면이 이루는 각\" → 두 깃대(법선벡터)가 이루는 각으로 바꿉니다.\n**상황 번역**: 두 바닥이 기울어진 만큼 깃대도 똑같이 기울어집니다. 법선벡터 (1, 1, 0), (0, 1, 1)\n**풀이**: cos θ = {{|0 + 1 + 0|§√{2} × √{2}}} = {{1§2}} → 60^{°}\n**함정**: 평면의 방정식에 없는 문자의 계수는 0입니다. x + y = 1의 법선벡터는 (1, 1, 0)입니다.", "src": "실전 다지기 10"}]}]);

 g4:[H(3,'mc','[그래프 추론] 함수 y = {{2§x − 1}} + 1 (x > 1)의 그래프와 직선 y = −x + k가 서로 다른 두 점에서 만나도록 하는 실수 k의 범위는?',['k > 2 + 2√2','k ≥ 2 + 2√2','k > 2√2','k < 2 − 2√2','k > 4'],'t = x − 1 > 0으로 놓으면 {{2§t}} + t = k − 2. t > 0에서 {{2§t}} + t ≥ 2√2 (t = √2일 때 최소, 접할 때) → 두 점: k − 2 > 2√2'),
  H(3,'mc','[그래프 추론] 곡선 y = {{k§x}} (x > 0, k > 0)과 직선 y = −x + 4가 만나지 않도록 하는 정수 k의 최솟값은?',['5','4','3','6','8'],'{{k§x}} = 4 − x → x^{2} − 4x + k = 0. 두 근의 합 4 > 0, 곱 k > 0이라 실근이 있으면 양수 → D = 16 − 4k < 0 → k > 4'),

function pool(cid){return C[cid].pr.map((p,i)=>Object.assign({},p,{id:cid+'-'+i,cid}))}
function genOne(cid){const g=C[cid].gen;if(!g)return null;const p=GEN[pick(g)]();return Object.assign(p,{id:cid+'-g'+Math.random().toString(36).slice(2,8),cid,gen:true})}
const lastSeen=id=>S.p[id]?S.p[id].last:-99;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickOne(cid,lv,used){
  const all=shuffle(pool(cid)).filter(p=>!used.has(p.id));
  const t=today();
  const fresh=p=>lastSeen(p.id)<t;
  let c=all.filter(p=>p.l===lv&&fresh(p)).sort((a,b)=>lastSeen(a.id)-lastSeen(b.id));
  if(!c.length&&lv<=2&&C[cid].gen&&Math.random()<.85){const g=genOne(cid);if(g)return g}
  if(!c.length){for(const d of [1,-1,2,-2]){c=all.filter(p=>p.l===lv+d&&fresh(p));if(c.length)break}}
  if(!c.length&&C[cid].gen)return genOne(cid);
  if(!c.length)c=all.filter(p=>p.l===lv).concat(all);
  // 같은 레벨에서 유형 섞기: 이미 고른 유형과 다른 것 우선
  const ut=new Set([...used].map(id=>id.split('|')[1]).filter(Boolean));
  const d=c.find(p=>!ut.has(p.t))||c[0];
  return d||null;
}
function prepare(p){if(p.t==='mc')p.order=shuffle(p.x.map((_,i)=>i));return p}
function pickSet(specs){ // specs: [{cid,lv}]
  const used=new Set(),out=[];
  for(const s of specs){const p=pickOne(s.cid,s.lv,used);if(p){used.add(p.id);used.add(p.id+'|'+p.t);out.push(prepare(p))}}
  return out;
}
function levelsFromBlank(score){return score<50?[1,1,2]:score<80?[1,2,3]:[2,3,3]}
function spiralCids(exclude,k){

  const t=today();

  return w.slice(0,k).map(x=>x.id);
}
function wrongProblem(exclude){
  const cand=S.wrong.filter(w=>w.day<today()&&inRange(w.cid)&&w.cid!==exclude);
  if(!cand.length)return null;const w=cand[0];
  if(w.g)return prepare(Object.assign({},w.g,{id:w.id,cid:w.cid,gen:true,retry:true}));
  const i=+w.id.split('-').pop();const base=C[w.cid]&&C[w.cid].pr[i];if(!base)return null;
  return prepare(Object.assign({},base,{id:w.id,cid:w.cid,retry:true}));
}
function chooseBlank(){
  const ids=rangeIds();const t=today();
  const due=ids.filter(id=>S.c[id]&&S.c[id].seen&&S.c[id].due<=t).sort((a,b)=>(S.c[a].due-S.c[b].due)||((mastery(a)||0)-(mastery(b)||0)));
  const nw=ids.find(id=>!S.c[id]||!S.c[id].seen);
  // 복습할 개념이 2개 이상이거나 하루 이상 밀렸으면 복습 백지, 아니면 새 개념으로 나아가고 복습은 플래시·나선 문제로
  if(due.length&&(!nw||due.length>=2||S.c[due[0]].due<t))return {cid:due[0],isNew:false};
  if(nw)return {cid:nw,isNew:true};
  const low=ids.slice().sort((a,b)=>(mastery(a)||0)-(mastery(b)||0));
  return {cid:low[0],isNew:false};
}
function flashCards(exclude){
  const t=today();const ids=rangeIds().filter(id=>id!==exclude&&S.c[id]&&S.c[id].seen);
  let src=ids.filter(id=>S.c[id].due<=t+1);

}

let DB=null,syncState='local',pushing=false,pending=false,pushT=null;
function schedulePush(){if(!DB)return;clearTimeout(pushT);pushT=setTimeout(pushRemote,1500)}
async function pushRemote(){if(!DB)return;if(pushing){pending=true;return}pushing=true;
  try{await DB.set({state:JSON.stringify(S),updatedAt:S.updatedAt});setSync('cloud')}catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){DB=null;setSync('local')}}
  pushing=false;if(pending){pending=false;pushRemote()}}
function setSync(s){syncState=s;const el=document.getElementById('sync');if(el){el.textContent=s==='cloud'?'☁︎ 기기 간 저장됨':s==='wait'?'☁︎ 연결 중…':'이 기기에 저장';el.className='sync '+s}}
async function initSync(){
  return; // NO_SYNC: 로그인 없이 이 기기에만 저장
  for(let i=0;i<20&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,250));
  if(!(window.claude&&window.claude.use))return;
  setSync('wait');
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setSync('local');return}
    const id=await user.id();if(!id){setSync('local');return}
    const ref=db.doc('data/users/'+id+'/progress');
    const timer=setTimeout(()=>setSync('local'),10000);
    const snap=await ref.get();clearTimeout(timer);DB=ref;
    let remote=null;if(snap.exists){try{remote=JSON.parse(snap.data().state)}catch(e){}}
    if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(fresh(),remote);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!RUN)render()}
    else if(!remote||(S.updatedAt||0)>(remote.updatedAt||0))await pushRemote();
    setSync('cloud');
  }catch(e){setSync('local')}
}

function daysLeft(){if(!S.examDate)return null;return Math.round((new Date(S.examDate+'T00:00:00').getTime()-new Date(dayStr(today())+'T00:00:00').getTime())/86400000)}
function dailyPool(){const dn=(S.daily&&S.daily.done)||{};return rangeIds().flatMap(id=>pool(id)).filter(p=>!dn[p.id])}
const dailyToday=()=>((S.daily&&S.daily.log)||{})[dayStr(today())]||0;
function similarTo(mid,m){const C0=C[m.cid];if(!C0)return null;
  if(C0.gen&&Math.random()<.7){const g=genOne(m.cid);if(g)return g}
  const dn=(S.daily&&S.daily.done)||{};const all=pool(m.cid).filter(p=>p.id!==mid&&!dn[p.id]);
  const sc=p=>(p.t===m.t?0:2)+Math.abs((p.l||1)-(m.l||1))+Math.random()*.5;
  const c=all.sort((a,b)=>sc(a)-sc(b))[0];if(c)return c;
  return pool(m.cid).find(p=>p.id===mid)||null}
function pickDaily(){
  const t0=today(),miss=Object.entries((S.daily&&S.daily.miss)||{}).filter(([k,m])=>m.day<t0||dailyToday()>=3).sort((a,b)=>a[1].day-b[1].day);
  const re=[];for(const [k,m] of miss){if(re.length>=5)break;const q=similarTo(k,m);if(q&&!re.some(x=>x.id===q.id))re.push(Object.assign({},q,{mid:k,retry:true}))}
  const MS=(S.daily&&S.daily.miss)||{};const pre=pickDaily0().filter(p=>!MS[p.id]&&!re.some(r=>r.id===p.id));
  const td=dailyToday(),need=td>=3?3:3-td;return re.map(prepare).concat(pre.slice(0,need))}
function retryLeft(){const t0=today();return Object.values((S.daily&&S.daily.miss)||{}).filter(m=>m.day<t0).length}
function pickDaily0(){
  const left=dailyPool().map(p=>{const m=mastery(p.cid);return {p,w:(m==null?.5:m)-(p.h?.35:0)+Math.random()*.35}}).sort((a,b)=>a.w-b.w).map(x=>x.p);
  const out=[],cids=new Set();
  for(const p of left){if(out.length===3)break;if(!cids.has(p.cid)){out.push(p);cids.add(p.cid)}}
  for(const p of left){if(out.length===3)break;if(!out.includes(p))out.push(p)}
  const g=rangeIds().filter(id=>C[id].gen);let t=0;while(out.length<3&&g.length&&t++<10){const q=genOne(pick(g));if(q)out.push(q)}
  return out.map(prepare);
}

// RUN = {mode, title, steps:[...], i, start}
function startSession(cidSel){
  const ch=(typeof cidSel==='string'&&C[cidSel])?{cid:cidSel,isNew:!(S.c[cidSel]&&S.c[cidSel].seen)}:chooseBlank();const steps=[];
  const fc=flashCards(ch.cid);if(fc.length)steps.push({k:'flash',cards:fc,j:0,show:false,res:[]});
  if(ch.isNew)steps.push({k:'learn',cid:ch.cid});
  steps.push({k:'blank',cids:[ch.cid],phase:'write',checked:{},t0:null});
  steps.push({k:'probs',list:null,j:0,ans:null,res:[],auto:true});
  steps.push({k:'done'});
  RUN={mode:'session',title:'오늘의 15분',steps,i:0,start:Date.now(),blankCid:ch.cid,re:()=>startSession(ch.cid)};
  go('run');startTick();
}
function startBlank(cids,title){RUN={mode:'blank',title,steps:[{k:'blank',cids,phase:'write',checked:{},t0:null},{k:'done'}],i:0,start:Date.now(),re:()=>startBlank(cids,title)};go('run');startTick()}
function startProbs(list,title,mode='practice'){if(!list.length){toast('풀 문제가 없어요');return}const copy=list.map(p=>Object.assign({},p));RUN={mode,title,steps:[{k:'probs',list,j:0,ans:null,res:[]},{k:'done'}],i:0,start:Date.now(),re:()=>startProbs(copy.map(p=>prepare(Object.assign({},p))),title,mode)};go('run');startTick()}
function practiceList(cids,n){const specs=[];for(let i=0;i<n;i++){const cid=cids[i%cids.length];const lv=PRACT.lv||lvFor(mastery(cid));specs.push({cid,lv})}return pickSet(shuffle(specs))}
function startTick(){clearInterval(TICK);TICK=setInterval(()=>{const el=document.getElementById('clock');if(!el||!RUN){return}el.textContent=clockText();const bt=document.getElementById('btimer');if(bt){const st=RUN.steps[RUN.i];if(st&&st.t0){const left=Math.max(0,240-Math.floor((Date.now()-st.t0)/1000));bt.textContent=mmss(left);bt.classList.toggle('over',left===0)}}},1000)}
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function clockText(){const e=Math.floor((Date.now()-RUN.start)/1000);const el=document.getElementById('clock');if(el&&RUN.target)el.classList.toggle('over',e>RUN.target);return RUN.mode==='session'?`⏱ ${mmss(e)} / 15:00`:RUN.target?`⏱ ${mmss(e)} / ${mmss(RUN.target)}`:`⏱ ${mmss(e)}`}
function startExam(){
  // 내신 실전: 객관식·단답 19 + 서술형 3 = 22문항, 중상(실력)·상(심화) 50% 이상, 학평 유형 우선, 목표 50분
  const ids=rangeIds();const all=ids.flatMap(id=>pool(id));
  const pick=(arr,n,used)=>{const by={};shuffle(arr).sort((x,y)=>(y.h||0)-(x.h||0)).forEach(p=>{if(!used.has(p.id))(by[p.cid]=by[p.cid]||[]).push(p)});
    const order=shuffle(Object.keys(by));const out=[];let r=0;while(out.length<n&&order.some(c=>by[c].length>r)){for(const c of order){if(out.length>=n)break;if(by[c][r]){out.push(by[c][r]);used.add(by[c][r].id)}}r++}return out};
  const used=new Set();
  const objHi=pick(all.filter(p=>p.l>=2&&(p.t==='mc'||p.t==='sa')),12,used);
  const objLo=pick(all.filter(p=>p.l===1&&(p.t==='mc'||p.t==='sa')),19-objHi.length,used);
  const desc=pick(all.filter(p=>p.t==='self'&&p.l>=2),3,used);
  const obj=shuffle(objHi.concat(objLo)).sort((x,y)=>x.l-y.l);
  const list=obj.concat(desc);
  if(list.length<8){toast('이 범위에는 실전 문항이 부족해요');return}
  startProbs(list.map(prepare),'실전 '+list.length+'문항','exam');RUN.target=50*60;RUN.steps[0].levelNote='객관식 '+obj.length+' · 서술형 '+desc.length+' · 목표 50분';
}

  }

  const a=st.ans;

}

  if(a==='start')recStart();else if(a==='stop'){if(REC.mr)REC.mr.stop()}else if(a==='again'){if(REC.url)URL.revokeObjectURL(REC.url);REC.url=null;recStart()}},true);
document.addEventListener('change',e=>{const i=e.target.closest('[data-recfile]');if(!i||!i.files||!i.files[0])return;if(REC.url)URL.revokeObjectURL(REC.url);REC.url=URL.createObjectURL(i.files[0]);REC.err=false;recPaint()});

// ===== LAUNCH_PATCH: 접속하면 무엇부터 할지 고르기 =====
function lpDaily(){const rn=Math.min(5,(typeof retryLeft==='function')?retryLeft():0);const l=pickDaily();return startProbs(l,rn?`지난 오답 ${rn} + 오늘의 3문제`:'오늘의 3문제','daily')}
function lpConcepts(){const ids=rangeIds();const units=[...new Set(ids.map(id=>C[id].u))];
  const dot=id=>{const m=mastery(id);return m==null?'':m<.5?'low':m<.8?'mid':'high'};
  return `<div class="lplist">${units.map(u=>`<div class="lpu">${esc(UNITS[u].t)}</div>`+ids.filter(id=>C[id].u===u).map(id=>`<button data-lpc="${id}"><i class="${dot(id)}"></i><span>${esc(C[id].t)}</span>${!(S.c[id]&&S.c[id].seen)?'<em>NEW</em>':''}</button>`).join('')).join('')}</div>`}
function lpPick(){ask('📘','어떤 개념으로 15분 할까요?','고른 개념으로 플래시 복습 → 백지 테스트 → 맞춤 문제가 열려요.',[],'닫기',lpConcepts())}
function lpOpen(){const t=dailyToday?dailyToday():0;const ch=chooseBlank();
  ask('🚌','오늘은 무엇부터 할까요?','<span style="font-size:11px;opacity:.6">앱 버전 '+APPVER+'</span>',[],'둘러보기',
   `<button class="lpbig d" data-lp="daily">📅 오늘의 3문제${t>=3?' (완료 ✓)':t?` (${t}/3)`:''}<small>${(typeof retryLeft==='function'&&retryLeft())?'지난 오답부터 다시 풀고 새 3문제':'시험 대비 매일 3문제'}</small></button>
    <button class="lpbig s" data-lp="auto">✨ 추천 15분<small>${esc(C[ch.cid].t)}${ch.isNew?' · NEW':' · 복습'}</small></button>
    <button class="lpbig c" data-lp="pick">📘 개념 골라서 15분<small>내가 고른 개념으로 백지 테스트</small></button>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lp],[data-lpc]');if(!b)return;e.preventDefault();e.stopPropagation();
  if(b.dataset.lpc){closeModal();startSession(b.dataset.lpc);return}
  const a=b.dataset.lp;if(a==='daily'){closeModal();lpDaily()}else if(a==='auto'){closeModal();startSession()}else if(a==='pick')lpPick()},true);
(function lpBoot(n){const md=document.getElementById('modal');if(md&&md.classList.contains('on')){if(n<40)setTimeout(()=>lpBoot(n+1),500);return}
  if(VIEW==='home'&&!RUN)lpOpen()})(0);
</script>

async function hardRefresh(){try{if(window.caches){for(const k of await caches.keys())await caches.delete(k)}if(navigator.serviceWorker){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}}catch(e){}location.replace(location.pathname+"?r="+Date.now())}</script></body></html>
